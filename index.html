        const DB = {
            getUsers: () => JSON.parse(localStorage.getItem('billetera_users_v6') || '{}'),
            register: (user, pass, isGoogle = false, profile = null) => {
                const users = DB.getUsers();
                if(users[user] && !isGoogle) return false; 
                users[user] = { password: pass, isGoogle, profile, vip: false };
                localStorage.setItem('billetera_users_v6', JSON.stringify(users));
                return true;
            },
            login: (user, pass) => {
                if (user === 'Admin' && pass === 'PrisionLove') return { success: true, role: 'admin' };
                const users = DB.getUsers();
                const u = users[user];
                if (!u) return { success: false };
                if (u.isGoogle && !pass) return { success: true, role: 'user', vip: u.vip, profile: u.profile }; 
                if (u.password === pass) return { success: true, role: 'user', vip: u.vip, profile: u.profile };
                return { success: false };
            },
            deleteUser: (user) => {
                const users = DB.getUsers();
                delete users[user];
                localStorage.setItem('billetera_users_v6', JSON.stringify(users));
                localStorage.removeItem(`txns_${user}`);
                localStorage.removeItem(`settings_${user}`);
            },
            changeUsername: (oldUser, newUser) => {
                const users = DB.getUsers();
                if(users[newUser] || oldUser === 'Admin' || newUser === 'Admin') return false;
                users[newUser] = users[oldUser];
                delete users[oldUser];
                localStorage.setItem('billetera_users_v6', JSON.stringify(users));
                
                const txns = localStorage.getItem(`txns_${oldUser}`);
                if (txns) { localStorage.setItem(`txns_${newUser}`, txns); localStorage.removeItem(`txns_${oldUser}`); }
                const settings = localStorage.getItem(`settings_${oldUser}`);
                if (settings) { localStorage.setItem(`settings_${newUser}`, settings); localStorage.removeItem(`settings_${oldUser}`); }
                return true;
            },
            changePassword: (user, newPass) => {
                const users = DB.getUsers();
                if(!users[user]) return false;
                users[user].password = newPass;
                localStorage.setItem('billetera_users_v6', JSON.stringify(users));
                return true;
            },
            toggleVip: (user) => {
                const users = DB.getUsers();
                if(!users[user]) return false;
                users[user].vip = !users[user].vip;
                localStorage.setItem('billetera_users_v6', JSON.stringify(users));
                return true;
            },
            getUserData: (user) => {
                const users = DB.getUsers();
                return users[user] || null;

        function decodeJwtResponse(token) {
            try {
                var base64Url = token.split('.')[1];
                var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch(e) {
                return null;
            }
        };

        function Home({ txns, settings, activeCurrency, setActiveCurrency, t, isVip, currentUser, setView }) {

            const fijos = currentTxns.filter(txn => txn.type === 'gasto' && txn.is_recurring).reduce((a, b) => a + b.amount, 0);
            const saldo = ingresos - gastos;
            const ahorroRecomendado = ingresos * 0.2;
            const pctAhorro = ahorroRecomendado > 0 ? Math.min(Math.round((saldo / ahorroRecomendado) * 100), 100) : (saldo > 0 ? 100 : 0);

            const quotesList = t('quotes') || ["Planea tus compras."];
            const diaDelAnio = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
            const fraseDiaria = quotesList[diaDelAnio % quotesList.length];

            const userData = DB.getUserData(currentUser);
            const displayUser = userData?.profile?.name ? userData.profile.name.split(' ')[0] : currentUser;

            return (
                <div className="p-4 space-y-4 view-animate">

            const [msg, setMsg] = useState('');
            const [modo, setModo] = useState('texto');
            const [escuchando, setEscuchando] = useState(false);
            const recognitionRef = useRef(null);

            const iniciarVoz = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) { alert("Tu navegador no soporta voz"); return; }
                const recognition = new SpeechRecognition();
                recognition.lang = settings.lang === 'es' ? 'es-PE' : 'en-US'; 
                recognition.interimResults = true; recognition.continuous = false;
                recognition.onresult = (e) => { let text = ""; for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript; setMsg(text); };
                recognition.onerror = () => { setEscuchando(false); };
                recognition.onend = () => { setEscuchando(false); };
                recognitionRef.current = recognition; recognition.start(); setEscuchando(true);
            };
            const detenerVoz = () => { if (recognitionRef.current) recognitionRef.current.stop(); setEscuchando(false); };

            const procesar = () => {
                if(!msg) return;
                const txt = msg.toLowerCase();
                const isIncome = txt.includes('recibi') || txt.includes('ingreso') || txt.includes('gane') || txt.includes('cobre');
                const type = isIncome ? 'ingreso' : 'gasto';
                const nums = txt.match(/\d+(\.\d+)?/);
                const amount = nums ? parseFloat(nums[0]) : 0;
                
                if(amount > 0) {
                    let cat = "Otros"; CATEGORIAS.forEach(c => { if(txt.includes(c.toLowerCase())) cat = c; });
                    addTxn({ id: Date.now(), type, amount, category: cat, description: msg, is_recurring: false, date: new Date().toISOString(), currency: activeCurrency });
                    alert(`✅ Registrado: ${type.toUpperCase()} - ${formatMoneda(amount, activeCurrency)} (${cat})`);

        function Analisis({ txns, settings, activeCurrency, setActiveCurrency, t, isVip }) {

                    <div className="p-4 view-animate flex flex-col items-center justify-center min-h-[70vh] text-center">

                    </div>
                );
            }

            const [isRefreshing, setIsRefreshing] = useState(false);
            const [refreshKey, setRefreshKey] = useState(0); 

            const currentTxnsAll = txns.filter(txn => txn.currency === activeCurrency);
            
            const today = new Date();
            const sevenDaysAgo = new Date(today.getTime() - (7 * 24 * 60 * 60 * 1000));
            const weeklyTxns = currentTxnsAll.filter(txn => new Date(txn.date) >= sevenDaysAgo);

            const ingresos = weeklyTxns.filter(txn => txn.type === 'ingreso').reduce((a, b) => a + b.amount, 0);
            const gastos = weeklyTxns.filter(txn => txn.type === 'gasto').reduce((a, b) => a + b.amount, 0);
            const balance = ingresos - gastos;

            const gastosByCategory = weeklyTxns.filter(txn => txn.type === 'gasto').reduce((acc, txn) => {
                acc[txn.category] = (acc[txn.category] || 0) + txn.amount; return acc;
            }, {});

            const topGastos = Object.entries(gastosByCategory).map(([categoria, total]) => ({ categoria, total })).sort((a, b) => b.total - a.total).slice(0, 5);
            
            const mayorGasto = topGastos.length > 0 ? topGastos[0].categoria : "Ninguna";
            const segundoGasto = topGastos.length > 1 ? topGastos[1].categoria : null;
            
            const ahorroPct = ingresos > 0 ? Math.round((balance / ingresos) * 100) : 0;
            const gastosPct = ingresos > 0 ? Math.round((gastos / ingresos) * 100) : 0;

            const handleRefresh = () => {
                setIsRefreshing(true);
                setTimeout(() => { setIsRefreshing(false); setRefreshKey(prev => prev + 1); }, 500);
            };

            return (
                <div key={refreshKey} className="p-4 space-y-4 view-animate">

                    <CurrencyTabs currencies={settings.currencies} activeCurrency={activeCurrency} setActiveCurrency={setActiveCurrency} />

                                <p className="text-sm">{t('income')}</p>
                            </div>
                            <p className="text-lg font-bold text-success">{formatMoneda(ingresos, activeCurrency)}</p>
                        </div>
                        <div className="bg-card rounded-xl p-4 border border-border shadow-sm">
                            <div className="flex items-center gap-2 mb-2 text-secondary">
                                <LucideTrendingDown className="w-4 h-4 text-error" />
                                <p className="text-sm">{t('expenses')}</p>
                            </div>
                            <p className="text-lg font-bold text-error">{formatMoneda(gastos, activeCurrency)}</p>
                        </div>
                    </div>

                    <div className={`rounded-xl p-5 text-center shadow-sm border ${balance >= 0 ? 'bg-success/10 border-success/30' : 'bg-error/10 border-error/30'}`}>
                        <p className="text-secondary text-sm mb-1">{t('weekly_balance')}</p>
                        <p className={`text-2xl font-bold ${balance >= 0 ? 'text-success' : 'text-error'}`}>
                            {balance >= 0 ? '+' : ''}{formatMoneda(balance, activeCurrency)}
                        </p>
                    </div>

                    <div className="bg-card rounded-xl p-5 border border-border shadow-sm mt-4">
                        <div className="flex items-center gap-2 mb-4">
                            <LucideLightbulb className="w-5 h-5 text-accent" />
                            <h2 className="text-sm font-bold text-primary">{t('analysis_rec_title')}</h2>
                        </div>
                        <ul className="space-y-4 text-sm text-secondary leading-relaxed">
                            <li className="flex items-start gap-3">
                                <span className="w-1.5 h-1.5 bg-accent rounded-full mt-2 shrink-0"></span>
                                <span>Ahorraste el {Math.max(0, ahorroPct)}%. {ahorroPct < 20 ? t('analysis_rec_save_low') : t('analysis_rec_save_high')}</span>
                            </li>
                            {gastos > 0 && mayorGasto !== "Ninguna" && (
                                <li className="flex items-start gap-3">
                                    <span className="w-1.5 h-1.5 bg-accent rounded-full mt-2 shrink-0"></span>
                                    <span>{t('analysis_rec_leak_1_a')}<strong className="text-primary">{mayorGasto}</strong>{t('analysis_rec_leak_1_b')}</span>
                                </li>
                            )}
                            {gastosPct > 80 && (
                                <li className="flex items-start gap-3"><span className="w-1.5 h-1.5 bg-accent rounded-full mt-2 shrink-0"></span><span>{t('analysis_rec_rule')}</span></li>
                            )}
                            <li className="flex items-start gap-3"><span className="w-1.5 h-1.5 bg-accent rounded-full mt-2 shrink-0"></span><span>{t('analysis_rec_tip')}</span></li>
                        </ul>
                    </div>
                </div>
            );
        }

        function Ajustes({ globalSettings, setGlobalSettings, onLogout, currentUser, isVip, t, setView }) {
            const [localSettings, setLocalSettings] = useState(globalSettings);
            const userData = DB.getUserData(currentUser);
            
            const handleCountryChange = (e) => {
                const countryCode = e.target.value;
                const countryData = ALL_COUNTRIES.find(c => c.name === countryCode);
                const newCurrencies = [...localSettings.currencies];
                newCurrencies[0] = countryData.defaultCurr; 
                setLocalSettings({ ...localSettings, country: countryCode, lang: countryData.lang, currencies: newCurrencies });
            };

            const handleCurrencyChange = (index, value) => {
                const newCurrencies = [...localSettings.currencies];
                newCurrencies[index] = value;
                setLocalSettings({ ...localSettings, currencies: newCurrencies });
            };

            const handleColorChange = (key, val) => {
                setLocalSettings({ ...localSettings, colors: { ...localSettings.colors, [key]: val } });
            };

            const toggleTheme = (themeType) => {
                if (themeType === 'dark') {
                    setLocalSettings({ ...localSettings, theme: 'dark', colors: { bg: '#111111', card: '#1e1e1e', text: '#ffffff', secondary: '#a1a1aa', border: '#27272a', accent: '#3b82f6', navBg: '#19191c', navActiveBg: '#2b3144', navActiveText: '#5a86ff' } });
                } else {
                    setLocalSettings({ ...localSettings, theme: 'light', colors: { bg: '#f4f4f5', card: '#ffffff', text: '#18181b', secondary: '#71717a', border: '#e4e4e7', accent: '#2563eb', navBg: '#ffffff', navActiveBg: '#e4e4e7', navActiveText: '#2563eb' } });
                }
            };

            const resetColors = () => {
                const isDark = localSettings.theme === 'dark';
                setLocalSettings({
                    ...localSettings,
                    colors: isDark 
                        ? { bg: '#111111', card: '#1e1e1e', text: '#ffffff', secondary: '#a1a1aa', border: '#27272a', accent: '#3b82f6', navBg: '#19191c', navActiveBg: '#2b3144', navActiveText: '#5a86ff' }
                        : { bg: '#f4f4f5', card: '#ffffff', text: '#18181b', secondary: '#71717a', border: '#e4e4e7', accent: '#2563eb', navBg: '#ffffff', navActiveBg: '#e4e4e7', navActiveText: '#2563eb' }
                });
            };

            const save = () => {
                setGlobalSettings(localSettings);
                setView('home');
            };

            const currentZoom = localSettings.zoom || 100;
            const colors = localSettings.colors || DEFAULT_SETTINGS.colors;

            return (
                <div className="p-4 space-y-4 view-animate">
                    <div className="flex items-center gap-3 mt-2 mb-4">
                        <button onClick={() => setView('home')} className="text-secondary hover:text-primary transition-colors">
                            <LucideChevronLeft className="w-6 h-6"/>
                        </button>
                        <h1 className="text-xl font-bold tracking-tight text-primary">{t('settings_title')}</h1>
                    </div>
                    
                    <div className="bg-card p-5 rounded-xl border border-border shadow-sm space-y-4">
                        <div className="flex justify-between items-center">
                            <div className="flex items-center gap-2 text-primary">
                                <LucideUser className="w-5 h-5 text-accent" />
                                <label className="text-xs font-bold uppercase tracking-wider">{t('account_title')}</label>
                            </div>
                            
                            {isVip ? (
                                <span className="bg-warning/20 text-warning text-[10px] uppercase font-bold px-2 py-1 rounded-md flex items-center gap-1"><LucideCrown className="w-3 h-3"/> VIP</span>
                            ) : (
                                <span className="bg-accent/20 text-accent text-[10px] uppercase font-bold px-2 py-1 rounded-md flex items-center gap-1"><LucideStar className="w-3 h-3"/> FREE</span>
                            )}
                        </div>
                        
                        {userData?.isGoogle && userData?.profile ? (
                            <div className="bg-background rounded-lg border border-border p-4 space-y-2">
                                <div className="flex items-center gap-3">
                                    {userData.profile.picture ? (
                                        <img src={userData.profile.picture} className="w-10 h-10 rounded-full border border-accent" alt="Profile" />
                                    ) : (
                                        <div className="w-10 h-10 rounded-full bg-accent flex items-center justify-center text-white font-bold">{userData.profile.name.charAt(0)}</div>
                                    )}
                                    <div>
                                        <p className="text-[10px] text-secondary uppercase font-bold text-accent">Google Oficial</p>
                                        <p className="text-sm font-bold text-primary">{userData.profile.name}</p>
                                    </div>
                                </div>
                                <p className="text-xs text-secondary mt-2">{userData.profile.email}</p>
                                <div className="grid grid-cols-2 gap-2 pt-2 border-t border-border mt-2">
                                    <div><p className="text-[10px] text-secondary uppercase">Edad</p><p className="text-sm font-medium text-primary">{userData.profile.age} años</p></div>
                                    <div><p className="text-[10px] text-secondary uppercase">País</p><p className="text-sm font-medium text-primary">{userData.profile.country}</p></div>
                                </div>
                            </div>
                        ) : (
                            <p className="text-xs text-secondary">{t('logged_in_as')} <strong className="text-primary text-base ml-1">{currentUser}</strong></p>
                        )}
                        
                        <button onClick={onLogout} className="w-full py-3.5 bg-error border border-error/50 text-white rounded-xl font-bold text-sm hover:opacity-90 transition-colors shadow-lg shadow-error/20 flex justify-center items-center gap-2">
                            <LucideLogOut className="w-4 h-4"/> {t('btn_logout')}
                        </button>
                    </div>

                    <div className="bg-card p-5 rounded-xl border border-border shadow-sm space-y-5">
                        
                        <div>
                            <label className="text-xs font-bold text-secondary uppercase tracking-wider block mb-2">{t('theme_mode')}</label>
                            <div className="grid grid-cols-2 gap-3">
                                <button type="button" onClick={() => toggleTheme('dark')} className={`py-3 rounded-xl border font-bold text-sm transition-all ${localSettings.theme === 'dark' ? 'bg-accent text-white border-accent' : 'bg-background text-secondary border-border'}`}>
                                    {t('mode_dark')}
                                </button>
                                <button type="button" onClick={() => toggleTheme('light')} className={`py-3 rounded-xl border font-bold text-sm transition-all ${localSettings.theme === 'light' ? 'bg-accent text-white border-accent' : 'bg-background text-secondary border-border'}`}>
                                    {t('mode_light')}
                                </button>
                            </div>
                        </div>

                        <div>
                            <label className="text-xs font-bold text-secondary uppercase tracking-wider block mb-2">{t('country')}</label>
                            <select value={localSettings.country} onChange={handleCountryChange} className="w-full p-4 rounded-xl border border-border bg-background outline-none text-primary text-sm">
                                {ALL_COUNTRIES.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                            </select>
                        </div>

                        <div>
                            <label className="text-xs font-bold text-secondary uppercase tracking-wider block mb-2">{t('language')}</label>
                            <select value={localSettings.lang} onChange={e=>setLocalSettings({...localSettings, lang: e.target.value})} className="w-full p-4 rounded-xl border border-border bg-background outline-none text-primary text-sm">
                                <option value="es">Español</option><option value="en">English</option>
                            </select>
                        </div>

                        <div>
                            <label className="text-xs font-bold text-secondary uppercase tracking-wider block mb-2">{t('zoom')}</label>
                            <div className="flex items-center justify-between bg-background p-3 rounded-xl border border-border">
                                <span className="text-primary font-bold text-base pl-1">{currentZoom}%</span>
                                <div className="flex items-center gap-2">
                                    <button type="button" onClick={() => setLocalSettings({...localSettings, zoom: Math.max(50, currentZoom - 10)})} className="w-9 h-9 rounded-lg bg-card border border-border flex items-center justify-center text-primary font-bold hover:bg-border transition-colors text-lg">-</button>
                                    <button type="button" onClick={() => setLocalSettings({...localSettings, zoom: Math.min(200, currentZoom + 10)})} className="w-9 h-9 rounded-lg bg-card border border-border flex items-center justify-center text-primary font-bold hover:bg-border transition-colors text-lg">+</button>
                                    <button type="button" onClick={() => setLocalSettings({...localSettings, zoom: 100})} className="px-3.5 py-2 rounded-xl border border-border bg-card text-primary text-xs font-medium hover:bg-border transition-colors">{t('reset')}</button>
                                </div>
                            </div>
                        </div>

                        {/* SECCIÓN COLORES (BLOQUEADA SI ES FREE) */}
                        <div className="pt-2 border-t border-border relative">
                            {!isVip && (
                                <div className="absolute inset-0 z-10 flex flex-col items-center justify-center bg-card/60 backdrop-blur-[2px] rounded-b-xl pb-2">
                                    <span className="bg-warning text-black text-[10px] uppercase font-bold px-3 py-1.5 rounded-md flex items-center gap-1 shadow-lg border border-warning/50">
                                        <LucideCrown className="w-3 h-3"/> Solo VIP
                                    </span>
                                </div>
                            )}

                            <div className={`transition-all ${!isVip ? 'opacity-40 pointer-events-none' : ''}`}>
                                <div className="flex justify-between items-center mb-3 mt-2">
                                    <label className="text-xs font-bold text-secondary uppercase tracking-wider">{t('colors_title')}</label>
                                    <button type="button" onClick={resetColors} className="text-xs text-accent hover:underline font-semibold">
                                        {t('reset_colors')}
                                    </button>
                                </div>
                                <div className="grid grid-cols-3 gap-3">
                                    <div className="text-center">
                                        <input type="color" value={colors.bg} onChange={e => handleColorChange('bg', e.target.value)} className="w-full h-10 rounded-lg bg-background border border-border cursor-pointer"/>
                                        <span className="text-[10px] text-secondary mt-1 block">{t('col_bg')}</span>
                                    </div>
                                    <div className="text-center">
                                        <input type="color" value={colors.card} onChange={e => handleColorChange('card', e.target.value)} className="w-full h-10 rounded-lg bg-background border border-border cursor-pointer"/>
                                        <span className="text-[10px] text-secondary mt-1 block">{t('col_card')}</span>
                                    </div>
                                    <div className="text-center">
                                        <input type="color" value={colors.accent} onChange={e => handleColorChange('accent', e.target.value)} className="w-full h-10 rounded-lg bg-background border border-border cursor-pointer"/>
                                        <span className="text-[10px] text-secondary mt-1 block">{t('col_accent')}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="pt-2 border-t border-border">
                            <label className="text-xs font-bold text-secondary uppercase tracking-wider block mb-3">Monedas Adicionales</label>
                            {[0, 1, 2].map(i => (
                                <div key={i} className="mb-3">
                                    <select value={localSettings.currencies[i] || ''} onChange={e => handleCurrencyChange(i, e.target.value)} className="w-full p-3.5 rounded-xl border border-border bg-background outline-none text-primary text-sm">
                                        <option value="">-- {i===0?'Requerido':'Opcional'} --</option>
                                        {Object.entries(ALL_CURRENCIES).map(([code, sym]) => <option key={code} value={code}>{code} ({sym})</option>)}
                                    </select>
                                </div>
                            ))}
                        </div>

                        <button onClick={save} className="w-full py-3.5 bg-accent text-white rounded-xl font-bold text-sm mt-2">{t('save_settings')}</button>
                    </div>
                </div>
            );
        }

        // --- APP PRINCIPAL ---
        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [isVip, setIsVip] = useState(false);
            
            const [view, setView] = useState('home'); 
            const [txns, setTxns] = useState([]);
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [activeCurrency, setActiveCurrency] = useState('PEN');

            useEffect(() => {
                const sessionUser = sessionStorage.getItem('billetera_active_user');
                const sessionRole = sessionStorage.getItem('billetera_active_role');
                if (sessionUser) {
                    if(sessionRole === 'admin') {
                        setIsAdmin(true); setCurrentUser(sessionUser);
                    } else {
                        loadUserData(sessionUser);
                    }
                }
            }, []);

            const loadUserData = (user) => {
                setCurrentUser(user);
                
                // Leer el estado VIP directo del objeto de usuario
                const uData = DB.getUserData(user);
                setIsVip(uData?.vip || false);
                
                const savedTxns = DB.getTxns(user);
                const savedSettings = DB.getSettings(user);
                setTxns(savedTxns);
                
                if(savedSettings) {
                    setSettings(savedSettings);
                    setActiveCurrency(savedSettings.currencies[0] || 'PEN');
                }
                setView('home');
            };

            const handleLogin = (user, role) => {
                sessionStorage.setItem('billetera_active_user', user);
                sessionStorage.setItem('billetera_active_role', role);
                if(role === 'admin') {
                    setIsAdmin(true); setCurrentUser(user);
                } else {
                    loadUserData(user);
                }
            };

            const handleLogout = () => {
                sessionStorage.removeItem('billetera_active_user'); sessionStorage.removeItem('billetera_active_role');
                setCurrentUser(null); setIsAdmin(false); setIsVip(false); setTxns([]); setSettings(DEFAULT_SETTINGS);
            };

            const translate = (key) => {
                const langDict = DICTIONARY[settings.lang] || DICTIONARY['es'];
                return langDict[key] || key;
            };

            const setGlobalSettings = (newSettings) => {
                if(!newSettings.currencies[0]) newSettings.currencies[0] = 'USD';
                setSettings(newSettings);
                DB.saveSettings(currentUser, newSettings);
                setActiveCurrency(newSettings.currencies[0]);
            };

            const addTxn = (t) => { const newTxns = [...txns, t]; setTxns(newTxns); DB.saveTxns(currentUser, newTxns); };
            const deleteTxn = (id) => { if(confirm("¿Eliminar?")) { const newTxns = txns.filter(t => t.id !== id); setTxns(newTxns); DB.saveTxns(currentUser, newTxns); } };
            const updateTxn = (updatedTxn) => { const newTxns = txns.map(t => t.id === updatedTxn.id ? updatedTxn : t); setTxns(newTxns); DB.saveTxns(currentUser, newTxns); };
            const clearAllTxns = () => { if(confirm("¿Borrar todo?")) { const newTxns = txns.filter(t => t.currency !== activeCurrency); setTxns(newTxns); DB.saveTxns(currentUser, newTxns); } };

            if (!currentUser) return <div className="min-h-screen font-sans" style={{ '--col-bg': '#111111', '--col-card': '#1e1e1e', '--col-text': '#ffffff', '--col-secondary': '#a1a1aa', '--col-border': '#27272a', '--col-accent': '#3b82f6' }}><AuthView onLogin={handleLogin} /></div>;
            if (isAdmin) return <div className="min-h-screen font-sans" style={{ '--col-bg': '#111111', '--col-card': '#1e1e1e', '--col-text': '#ffffff', '--col-secondary': '#a1a1aa', '--col-border': '#27272a', '--col-accent': '#3b82f6' }}><AdminPanel onLogout={handleLogout} /></div>;

            const renderView = () => {
                switch(view) {
                    case 'home': return <Home txns={txns} settings={settings} activeCurrency={activeCurrency} setActiveCurrency={setActiveCurrency} t={translate} isVip={isVip} currentUser={currentUser} setView={setView}/>;
                    case 'nueva': return <Nueva addTxn={addTxn} settings={settings} activeCurrency={activeCurrency} setActiveCurrency={setActiveCurrency} t={translate} setView={setView}/>;
                    case 'analisis': return <Analisis txns={txns} settings={settings} activeCurrency={activeCurrency} setActiveCurrency={setActiveCurrency} t={translate} isVip={isVip}/>;
                    case 'chat': return <Chat addTxn={addTxn} settings={settings} activeCurrency={activeCurrency} t={translate} isVip={isVip}/>;
                    case 'historial': return <Historial txns={txns} settings={settings} activeCurrency={activeCurrency} setActiveCurrency={setActiveCurrency} deleteTxn={deleteTxn} updateTxn={updateTxn} clearAllTxns={clearAllTxns} t={translate}/>;
                    case 'ajustes': return <Ajustes globalSettings={settings} setGlobalSettings={setGlobalSettings} onLogout={handleLogout} currentUser={currentUser} isVip={isVip} t={translate} setView={setView}/>;
                    default: return <Home txns={txns} settings={settings} activeCurrency={activeCurrency} setActiveCurrency={setActiveCurrency} t={translate} isVip={isVip} currentUser={currentUser} setView={setView}/>;
                }
            };

            const NAV_ITEMS = [
                { id: 'home', label: 'nav_home', Icon: LucideHome },
                { id: 'nueva', label: 'nav_new', Icon: LucidePlusCircle },
                { id: 'analisis', label: 'nav_analysis', Icon: LucideBrain },
                { id: 'chat', label: 'nav_chat', Icon: LucideMessageCircle },
                { id: 'historial', label: 'nav_history', Icon: LucideList }
            ];

            const zoomScale = (settings.zoom || 100) / 100;
            const colors = settings.colors || DEFAULT_SETTINGS.colors;

            return (
                <div className="min-h-screen font-sans flex flex-col overflow-auto" style={{
                        '--col-bg': colors.bg, '--col-card': colors.card,
                        '--col-text': colors.text || (settings.theme === 'light' ? '#18181b' : '#ffffff'),
                        '--col-secondary': colors.secondary || (settings.theme === 'light' ? '#71717a' : '#a1a1aa'),
                        '--col-border': colors.border || (settings.theme === 'light' ? '#e4e4e7' : '#27272a'),
                        '--col-accent': colors.accent,
                        '--col-nav-bg': colors.navBg || (settings.theme === 'light' ? '#ffffff' : '#19191c'),
                        '--col-nav-active-bg': colors.navActiveBg || (settings.theme === 'light' ? '#e4e4e7' : '#2b3144'),
                        '--col-nav-active-text': colors.accent
                    }}>
                    <div className="flex-1 pb-20" style={{ transform: `scale(${zoomScale})`, transformOrigin: 'top center', transition: 'transform 0.2s ease-in-out' }}>
                        {renderView()}
                    </div>
                    
                    {view !== 'ajustes' && (
                        <div className="fixed bottom-4 left-1/2 w-[92%] max-w-sm bg-nav-bg rounded-full flex justify-around px-2 py-2 items-center shadow-2xl border border-border z-50" style={{ transform: `translateX(-50%) scale(${zoomScale})`, transformOrigin: 'bottom center' }}>
                            {NAV_ITEMS.map(({ id, label, Icon }) => {
                                const active = view === id;
                                return (
                                    <button key={id} onClick={() => setView(id)} className={`relative flex flex-col items-center justify-center min-w-[4rem] px-3 py-2 rounded-[1.25rem] transition-all duration-200 ${active ? 'bg-nav-active-bg text-nav-active-text' : 'text-secondary hover:text-primary'}`}>
                                        <Icon className={active ? '' : 'text-secondary'}/>
                                        <span className={`text-[11px] mt-1 font-medium tracking-wide ${active ? 'text-nav-active-text' : 'text-secondary'}`}>{translate(label)}</span>
                                    </button>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
