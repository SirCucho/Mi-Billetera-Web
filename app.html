        function Dashboard({ txns, cur, setActiveCurrency, settings, t, isVip, user, onOpenSettings, onOpenCountryMenu, expire, formatMoneda, Icons, c }) {
            const catList = useMemo(() => Array.isArray(t('categories')) ? t('categories') : ["Salario", "Comida", "Transporte", "Servicios", "Vivienda", "Salud", "Educación", "Entretenimiento", "Inversión", "Otros"], [t]);
            
            // OPTIMIZACIÓN: Memoización de cálculos pesados
            const { inC, outC, fijos, bal, pct, target } = useMemo(() => {
                const safeTxns = Array.isArray(txns) ? txns : [];
                const m = safeTxns.filter(x => x && x.currency === cur);
                
                const income = m.filter(x=>x.type==='ingreso').reduce((a,b)=>a+(Number(b.amount)||0),0); 
                const outcome = m.filter(x=>x.type==='gasto').reduce((a,b)=>a+(Number(b.amount)||0),0);
                const fixed = m.filter(x=>x.type==='gasto' && (x.category===catList[3] || x.category===catList[4])).reduce((a,b)=>a+(Number(b.amount)||0),0);
                
                const balance = income - outcome; 
                const goal = income * 0.2; 
                const percentage = goal>0 ? Math.min(Math.round((balance/goal)*100),100) : (balance>0?100:0);
                
                return { inC: income, outC: outcome, fijos: fixed, bal: balance, pct: percentage, target: goal };

        // --- PANTALLA 4: HISTORIAL (SEGURA Y FORTIFICADA) ---
        function Historial({ txns, cur, setCur, curList, deleteTxn, updateTxn, t, isVip, user, onOpenSettings, onOpenCountryMenu, settings, formatMoneda, Icons, c }) {
            const [filtro, setFiltro] = useState('Semanal'); 
            const [currentDate, setCurrentDate] = useState(() => new Date());
            const [selectedDay, setSelectedDay] = useState(null);
            const [editingTxn, setEditingTxn] = useState(null);

            // OPTIMIZACIÓN: Memoización de datos filtrados para el historial
            const { displayTxns, inTotal, outTotal, checkDayHasTxns, label, daysInMonth, firstDay, month, year } = useMemo(() => {
                const safeTxns = Array.isArray(txns) ? txns : [];
                const currentTxnsAll = safeTxns.filter(txn => txn && txn.currency === cur);
                
                const yr = currentDate.getFullYear(); const mth = currentDate.getMonth();
                const dInMonth = new Date(yr, mth + 1, 0).getDate(); 
                const fDay = new Date(yr, mth, 1).getDay();

                const checkDay = (d) => { 
                    const dateStr = new Date(yr, mth, d).toISOString().split('T')[0]; 
                    return currentTxnsAll.some(txn => txn.date && txn.date.startsWith(dateStr)); 
                };

                let dTxns = [...currentTxnsAll].reverse(); let lbl = "";
                if (filtro === 'Diario' && selectedDay) {
                    const dateStr = new Date(yr, mth, selectedDay).toISOString().split('T')[0];
                    dTxns = dTxns.filter(txn => txn.date && txn.date.startsWith(dateStr));
                    lbl = `${selectedDay} DE ${MESES[mth].toUpperCase()} ${yr}`; // BUG FIX APLICADO AQUÍ
                } else if (filtro === 'Semanal') {
                    dTxns = dTxns.filter(txn => txn.date && new Date(txn.date).getMonth() === mth);
                    lbl = `SEM · ${MESES[mth].substring(0,3).toUpperCase()}. ${yr}`; // BUG FIX APLICADO AQUÍ
                } else {
                    dTxns = dTxns.filter(txn => txn.date && new Date(txn.date).getMonth() === mth);
                    lbl = `${MESES[mth].toUpperCase()} ${yr}`; // BUG FIX APLICADO AQUÍ
                }

                const inT = dTxns.filter(txn => txn.type === 'ingreso').reduce((a, b) => a + (Number(b.amount)||0), 0);
                const outT = dTxns.filter(txn => txn.type === 'gasto').reduce((a, b) => a + (Number(b.amount)||0), 0);

                return { displayTxns: dTxns, inTotal: inT, outTotal: outT, checkDayHasTxns: checkDay, label: lbl, daysInMonth: dInMonth, firstDay: fDay, month: mth, year: yr };
            }, [txns, cur, currentDate, filtro, selectedDay]);

            const changeMonth = (dir) => { setCurrentDate(new Date(year, month + dir, 1)); setSelectedDay(null); };
            
            // ... Mismo JSX que tienes, solo asegúrate de reemplazar `MESES[month]` por la constante global correcta
            
            return (
                <div className={`p-4 space-y-4 view-animate`}>
                    <TopHeader title={t('history')||'Historial'} user={user} isVip={isVip} onOpenSettings={onOpenSettings} country={settings.country} onOpenCountryMenu={onOpenCountryMenu} c={c} />

                    <div className="flex justify-between items-center text-[10px] font-bold text-secondary uppercase tracking-widest mt-6 mb-2 bg-background p-2.5 rounded-lg border" style={{borderColor: c.border}}>
                        <span>{label}</span>
                        <div className="flex gap-4"><span className="text-success">+{formatMoneda(inTotal, cur)}</span><span className="text-error">-{formatMoneda(outTotal, cur)}</span></div>
                    </div>
                    {/* ... Resto idéntico ... */}
                </div>
            );
        }
