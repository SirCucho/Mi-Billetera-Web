                return true;

            const [backupCode, setBackupCode] = useState('');

            const userData = DB.getUserData(currentUser);
            
            const handleBackup = async () => {
                let phone = localSettings.phone || '';
                if(!phone) { alert("Ingresa tu WhatsApp más abajo."); return; }
                const pwd = prompt("🔒 CREA UNA CONTRASEÑA para cifrar este respaldo:");
                if(!pwd) return;
                const txnsData = DB.getTxns(currentUser);
                const encryptedData = CryptoJS.AES.encrypt(JSON.stringify({ txns: txnsData }), pwd).toString();
                try {
                    await navigator.clipboard.writeText(encryptedData);
                    window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent("*Respaldo Mi Billetera*\n\nAcabo de copiar mi código. Lo pegaré a continuación.")}`, '_blank');
                } catch (err) { alert("Navegador bloqueó copiado. Hazlo manualmente."); }
            };

            const handleRestore = () => {
                if(!backupCode) return alert("Pega el código.");
                const pwd = prompt("🔓 INGRESA LA CONTRASEÑA de cifrado:");
                if(!pwd) return;
                try {
                    const decryptedData = CryptoJS.AES.decrypt(backupCode, pwd).toString(CryptoJS.enc.Utf8);
                    if(!decryptedData) throw new Error();
                    const decoded = JSON.parse(decryptedData);
                    if(decoded.txns && confirm("¿Reemplazar transacciones actuales?")) {
                        DB.saveTxns(currentUser, decoded.txns); alert("Restaurado con éxito."); window.location.reload();

                // RE-CÁLCULO DEL HASH

                if (hashStr === expectedHash) {
                    const formattedDate = `${dateStr.substring(0,4)}-${dateStr.substring(4,6)}-${dateStr.substring(6,8)}`;

                                </div>
                            </div>
                        </div>

                        <div className="pt-2 border-t border-border">
                            <label className="text-xs font-bold text-secondary uppercase tracking-wider block mb-3 flex items-center gap-2"><LucideShield className="w-5 h-5 text-success" /> Respaldo Cifrado</label>
                            <input type="tel" value={localSettings.phone || ''} onChange={e=>setLocalSettings({...localSettings, phone: e.target.value})} className="w-full p-3.5 rounded-xl border border-border bg-background outline-none text-primary text-sm mb-3" placeholder="Tu WhatsApp"/>
                            <button onClick={handleBackup} className="w-full py-3 bg-success/10 text-success border border-success/30 rounded-xl font-bold text-sm hover:bg-success hover:text-white mb-4">↑ Respaldar (WhatsApp)</button>
                            <textarea value={backupCode} onChange={e=>setBackupCode(e.target.value)} className="w-full p-3 border border-border rounded-xl mb-2 bg-background text-primary outline-none resize-none text-xs font-mono" rows="2" placeholder="Pega el código aquí..."></textarea>
                            <button onClick={handleRestore} className="w-full py-3 bg-background border border-border text-primary rounded-xl font-bold text-sm hover:bg-border">↓ Restaurar</button>
                        </div>
                        <button onClick={save} className="w-full py-3.5 bg-accent text-white rounded-xl font-bold text-sm mt-2">Guardar Ajustes</button>
                    </div>
                </div>
            );
        }

        // --- APP PRINCIPAL ---
        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [isVip, setIsVip] = useState(false);
            const [expireAt, setExpireAt] = useState(null);
            const [showPayment, setShowPayment] = useState(false);
            const [view, setView] = useState('home'); 
            const [txns, setTxns] = useState([]);
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [activeCurrency, setActiveCurrency] = useState('PEN');

            useEffect(() => {
                const sessionUser = sessionStorage.getItem('billetera_active_user');
                if (sessionUser) loadUserData(sessionUser);
            }, []);

            const loadUserData = (user) => {
                setCurrentUser(user);
                const uData = DB.getUserData(user);
                
                // MOTOR DE CADUCIDAD AUTOMÁTICA
                let activeVip = false;
                let currentExpiration = null;
                
                if (uData?.vip) {
                    const today = new Date().toISOString().split('T')[0];
                    if (uData.expireAt && uData.expireAt >= today) {
                        activeVip = true;
                        currentExpiration = uData.expireAt;
                    } else {
                        // El código ha caducado. Se revierte a cuenta FREE en la base de datos local
                        DB.deactivateVip(user);
                        alert("⚠️ Tu suscripción VIP ha caducado. Has vuelto a la versión gratuita.");
                    }
                }
                
                setIsVip(activeVip);
                setExpireAt(currentExpiration);
                
                setTxns(DB.getTxns(user));
                const s = DB.getSettings(user);
                setSettings(s); setActiveCurrency(s.currencies[0] || 'PEN');
                setView('home');
            };

            const handleLogin = (user) => { sessionStorage.setItem('billetera_active_user', user); loadUserData(user); };
            const handleLogout = () => { sessionStorage.removeItem('billetera_active_user'); setCurrentUser(null); };

            if (!currentUser) return <div className="min-h-screen font-sans" style={{ '--col-bg': '#111111', '--col-card': '#1e1e1e', '--col-text': '#ffffff', '--col-secondary': '#a1a1aa', '--col-border': '#27272a', '--col-accent': '#3b82f6' }}><AuthView onLogin={handleLogin} /></div>;

            const renderView = () => {
                switch(view) {
                    case 'home': return <Home txns={txns} settings={settings} activeCurrency={activeCurrency} setActiveCurrency={setActiveCurrency} t={(k)=>DICTIONARY[settings.lang][k]} isVip={isVip} currentUser={currentUser} setView={setView} expireAt={expireAt}/>;
                    case 'ajustes': return <Ajustes globalSettings={settings} setGlobalSettings={(s)=>{setSettings(s); DB.saveSettings(currentUser,s); setActiveCurrency(s.currencies[0]);}} onLogout={handleLogout} currentUser={currentUser} isVip={isVip} t={(k)=>DICTIONARY[settings.lang][k]} setView={setView} onUpgrade={() => setShowPayment(true)}/>;
                    default: return <div className="p-4 text-center mt-20 text-secondary">La vista <b className="text-primary">{view}</b> está resumida en esta previsualización para enfocarnos en la seguridad. <br/><br/><button onClick={()=>setView('home')} className="text-accent underline">Volver al inicio</button></div>;
                }
            };

            const NAV_ITEMS = [{ id: 'home', Icon: LucideHome }, { id: 'nueva', Icon: LucidePlusCircle }, { id: 'analisis', Icon: LucideBrain }, { id: 'chat', Icon: LucideMessageCircle }, { id: 'historial', Icon: LucideList }];
            const zoomScale = (settings.zoom || 100) / 100;

            return (
                <div className="min-h-screen font-sans flex flex-col overflow-auto relative" style={{ '--col-bg': settings.colors.bg, '--col-card': settings.colors.card, '--col-text': settings.colors.text, '--col-secondary': settings.colors.secondary, '--col-border': settings.colors.border, '--col-accent': settings.colors.accent, '--col-nav-bg': settings.colors.navBg, '--col-nav-active-bg': settings.colors.navActiveBg, '--col-nav-active-text': settings.colors.accent }}>
                    <div className="flex-1 pb-20" style={{ transform: `scale(${zoomScale})`, transformOrigin: 'top center', transition: 'transform 0.2s' }}>{renderView()}</div>
                    {view !== 'ajustes' && (
                        <div className="fixed bottom-4 left-1/2 w-[92%] max-w-sm bg-nav-bg rounded-full flex justify-around px-2 py-2 items-center shadow-2xl border border-border z-50" style={{ transform: `translateX(-50%) scale(${zoomScale})`, transformOrigin: 'bottom center' }}>
                            {NAV_ITEMS.map(({ id, Icon }) => {
                                const active = view === id;
                                return <button key={id} onClick={() => setView(id)} className={`relative flex flex-col items-center justify-center min-w-[4rem] px-3 py-2 rounded-[1.25rem] transition-all duration-200 ${active ? 'bg-nav-active-bg text-nav-active-text' : 'text-secondary hover:text-primary'}`}><Icon/></button>;
                            })}
                        </div>
                    )}
                    {showPayment && <PaymentModal onClose={() => setShowPayment(false)} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
