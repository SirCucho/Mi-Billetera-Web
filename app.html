        // --- PANTALLA 2: REGISTRO UNIFICADO ---
        function RegistroUnificado({ addTxn, cur, t, isVip, user, onOpenSettings, onUpgrade }) {
            const [tipo, setTipo] = useState('gasto'); const [monto, setMonto] = useState(''); const [cat, setCat] = useState(CATEGORIAS[0]); const [desc, setDesc] = useState('');
            const [iaMode, setIaMode] = useState('texto'); const [iaMsg, setIaMsg] = useState(''); const [escuchando, setEscuchando] = useState(false);
            const recRef = useRef(null);

            const guardarManual = (e) => {
                e.preventDefault(); if(!monto || isNaN(monto) || monto<=0) return;
                addTxn({ id: Date.now(), type: tipo, amount: parseFloat(monto), category: cat, description: desc||cat, date: new Date().toISOString(), currency: cur });
                setMonto(''); setDesc(''); alert("✅ Registrado.");
            };

            const toggleVoz = () => {
                if(escuchando) { recRef.current?.stop(); setEscuchando(false); return; }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if(!SR) return alert("Navegador no soporta voz.");
                const rec = new SR(); rec.lang = 'es-ES'; rec.interimResults = true;
                rec.onresult = (e) => { let txt=""; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript; setIaMsg(txt); };
                rec.onerror = () => setEscuchando(false); rec.onend = () => setEscuchando(false);
                recRef.current = rec; rec.start(); setEscuchando(true);
            };

            const procesarIA = () => {
                if(!iaMsg) return; const txt = iaMsg.toLowerCase();
                const isInc = txt.includes('recibi')||txt.includes('ingreso')||txt.includes('gane'); const type = isInc ? 'ingreso' : 'gasto';
                const nums = txt.match(/\d+(\.\d+)?/); const amount = nums ? parseFloat(nums[0]) : 0;
                if(amount > 0) {
                    let c = "Otros"; CATEGORIAS.forEach(x => { if(txt.includes(x.toLowerCase())) c = x; });
                    addTxn({ id: Date.now(), type, amount, category: c, description: iaMsg, date: new Date().toISOString(), currency: cur });
                    setIaMsg(''); setIaMode('texto'); alert(`🤖 IA: ${type.toUpperCase()} - ${formatMoneda(amount, cur)} (${c}) guardado.`);
                } else alert("🤖 IA: No detecté ningún monto.");
            };

            return (
                <div className="p-4 space-y-6 view-animate">
                    <TopHeader title="Registro" user={user} isVip={isVip} onOpenSettings={onOpenSettings} />
                    
                    <div className="bg-card rounded-3xl p-5 border border-border shadow-lg">

                                <button type="button" onClick={()=>setTipo('ingreso')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${tipo==='ingreso'?'bg-success text-white':'text-secondary'}`}>Ingreso</button>
                            </div>

                            <div className="flex gap-2">
                                <select value={cat} onChange={e=>setCat(e.target.value)} className="w-1/2 p-3 rounded-xl border border-border bg-background outline-none text-sm text-primary font-bold">{CATEGORIAS.map(c=><option key={c} value={c}>{c}</option>)}</select>
                                <input type="text" value={desc} onChange={e=>setDesc(e.target.value)} className="w-1/2 p-3 rounded-xl border border-border bg-background outline-none text-sm text-primary" placeholder="Nota"/>
                            </div>
                            <button type="submit" className="w-full py-3.5 bg-accent text-white rounded-xl font-bold shadow-lg shadow-accent/30">{t('btn_save')}</button>
                        </form>
                    </div>

                    <div className="relative bg-card rounded-3xl p-5 border border-border shadow-lg overflow-hidden">
                        <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-warning"><Icons.Brain c="w-5 h-5"/> {t('ai')}</h2>
                        
                        {!isVip && (
                            <div className="absolute inset-0 z-10 glass-panel flex flex-col items-center justify-center text-center p-6">
                                <div className="w-12 h-12 bg-warning/20 text-warning rounded-full flex items-center justify-center mb-3"><Icons.Crown c="w-6 h-6"/></div>
                                <h3 className="font-bold text-white mb-2">Desbloquea la Inteligencia Artificial</h3>

                            </div>
                        )}

                        <div className={!isVip ? "opacity-30 pointer-events-none filter blur-sm" : ""}>
                            <div className="flex bg-background rounded-xl p-1 mb-4 border border-border">
                                <button onClick={()=>{setIaMode('texto'); if(escuchando) toggleVoz();}} className={`flex-1 py-2 rounded-lg font-bold text-sm ${iaMode==='texto'?'bg-card text-primary shadow-sm':'text-secondary'}`}>{t('text_ai')}</button>
                                <button onClick={()=>setIaMode('voz')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${iaMode==='voz'?'bg-card text-primary shadow-sm':'text-secondary'}`}>{t('voice_ai')}</button>

                            {iaMode === 'texto' ? (

                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- PANTALLA 3: ANÁLISIS IA ---
        function Analisis({ txns, cur, t, isVip, user, onOpenSettings, onUpgrade }) {
            if (!isVip) {
                return (
                    <div className="p-4 view-animate h-screen flex flex-col">
                        <TopHeader title="Análisis IA" user={user} isVip={isVip} onOpenSettings={onOpenSettings} />
                        <div className="flex-1 flex flex-col items-center justify-center text-center pb-20">
                            <div className="w-20 h-20 rounded-full bg-warning/10 text-warning flex items-center justify-center mb-6 shadow-lg border border-warning/20"><Icons.Crown c="w-10 h-10" /></div>
                            <h2 className="text-2xl font-bold text-primary mb-3">Evaluación Semanal VIP</h2>
                            <p className="text-secondary text-sm mb-6 max-w-xs leading-relaxed">Analiza tus gastos automáticamente y recibe recomendaciones inteligentes para ahorrar más.</p>
                            <button onClick={onUpgrade} className="bg-warning text-black text-sm uppercase font-bold px-6 py-3 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.4)] hover:scale-105 transition-transform">Ver Planes</button>
                        </div>
                    </div>
                );
            }

            const currentTxnsAll = txns.filter(txn => txn.currency === cur);
            const today = new Date(); const sevenDaysAgo = new Date(today.getTime() - (7 * 24 * 60 * 60 * 1000));
            const weeklyTxns = currentTxnsAll.filter(txn => new Date(txn.date) >= sevenDaysAgo);
            const ingresos = weeklyTxns.filter(txn => txn.type === 'ingreso').reduce((a, b) => a + b.amount, 0);
            const gastos = weeklyTxns.filter(txn => txn.type === 'gasto').reduce((a, b) => a + b.amount, 0);
            const balance = ingresos - gastos;

            return (
                <div className="p-4 space-y-4 view-animate">
                    <TopHeader title="Análisis IA" user={user} isVip={isVip} onOpenSettings={onOpenSettings} />
                    
                    <p className="text-secondary text-sm font-bold uppercase tracking-widest mt-1 mb-6 text-center">{t('last_7')}</p>
                    
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-card rounded-3xl p-5 border border-border shadow-md"><p className="text-[10px] uppercase font-bold text-secondary mb-1">Ingresos</p><p className="text-xl font-extrabold text-success">{formatMoneda(ingresos, cur)}</p></div>
                        <div className="bg-card rounded-3xl p-5 border border-border shadow-md"><p className="text-[10px] uppercase font-bold text-secondary mb-1">Gastos</p><p className="text-xl font-extrabold text-error">{formatMoneda(gastos, cur)}</p></div>
                    </div>

                    <div className={`rounded-3xl p-6 text-center shadow-lg border ${balance >= 0 ? 'bg-success/10 border-success/30' : 'bg-error/10 border-error/30'}`}>
                        <p className="text-secondary text-xs font-bold uppercase tracking-widest mb-2">{t('weekly_balance')}</p>
                        <p className={`text-4xl font-extrabold ${balance >= 0 ? 'text-success' : 'text-error'}`}>{balance >= 0 ? '+' : ''}{formatMoneda(balance, cur)}</p>
                    </div>

                    <div className="bg-card rounded-3xl p-6 border border-border shadow-lg mt-6">
                        <h2 className="text-sm font-bold text-warning mb-5 flex items-center gap-2"><Icons.Brain c="w-6 h-6"/> IA Recomienda</h2>
                        <ul className="space-y-4 text-sm text-secondary font-medium leading-relaxed">
                            <li className="flex items-start gap-3"><span className="text-accent mt-0.5 font-bold">●</span><span>Ahorraste el {Math.max(0, ingresos > 0 ? Math.round((balance/ingresos)*100) : 0)}% esta semana.</span></li>
                            <li className="flex items-start gap-3"><span className="text-accent mt-0.5 font-bold">●</span><span>Aplica la regla 50/30/20 para un mejor balance.</span></li>
                            <li className="flex items-start gap-3"><span className="text-accent mt-0.5 font-bold">●</span><span>Evita compras impulsivas en fines de semana.</span></li>
                        </ul>
                    </div>
                </div>
            );
        }

        // --- PANTALLA 4: HISTORIAL ---
        function Historial({ txns, cur, setCur, curList, deleteTxn, updateTxn, t, isVip, user, onOpenSettings }) {
            const currentTxnsAll = txns.filter(txn => txn.currency === cur);
            const [filtro, setFiltro] = useState('Semanal'); 
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedDay, setSelectedDay] = useState(null);
            const [editingTxn, setEditingTxn] = useState(null);

            const year = currentDate.getFullYear(); const month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate(); const firstDay = new Date(year, month, 1).getDay();

            const changeMonth = (dir) => { setCurrentDate(new Date(year, month + dir, 1)); setSelectedDay(null); };
            const checkDayHasTxns = (d) => { const dateStr = new Date(year, month, d).toISOString().split('T')[0]; return currentTxnsAll.some(txn => txn.date && txn.date.startsWith(dateStr)); };

            let displayTxns = [...currentTxnsAll].reverse(); let label = "";
            if (filtro === 'Diario' && selectedDay) {
                const dateStr = new Date(year, month, selectedDay).toISOString().split('T')[0];
                displayTxns = displayTxns.filter(txn => txn.date && txn.date.startsWith(dateStr));
                label = `${selectedDay} DE ${MESES[month].toUpperCase()} ${year}`;
            } else if (filtro === 'Semanal') {
                displayTxns = displayTxns.filter(txn => new Date(txn.date).getMonth() === month);
                label = `SEM · ${MESES[month].substring(0,3).toUpperCase()}. ${year}`;
            } else {
                displayTxns = displayTxns.filter(txn => new Date(txn.date).getMonth() === month);
                label = `${MESES[month].toUpperCase()} ${year}`;
            }

            const inTotal = displayTxns.filter(txn => txn.type === 'ingreso').reduce((a, b) => a + b.amount, 0);
            const outTotal = displayTxns.filter(txn => txn.type === 'gasto').reduce((a, b) => a + b.amount, 0);

            const EditModal = ({ txn, onClose }) => {
                const [monto, setMonto] = useState(txn.amount); const [cat, setCat] = useState(txn.category); const [desc, setDesc] = useState(txn.description);
                const handleSave = (e) => { e.preventDefault(); updateTxn({ ...txn, amount: parseFloat(monto), category: cat, description: desc }); onClose(); };
                return (
                    <div className="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4">
                        <div className="bg-card w-full max-w-sm rounded-3xl p-6 border border-border shadow-2xl view-animate relative">
                            <button onClick={onClose} className="absolute top-4 right-4 bg-background border border-border rounded-full p-1.5 text-secondary hover:text-white transition z-10"><Icons.X c="w-5 h-5"/></button>
                            <h2 className="text-xl font-bold mb-6 text-primary flex items-center gap-2"><Icons.Pencil c="w-5 h-5 text-accent"/> Editar</h2>
                            <form onSubmit={handleSave} className="space-y-4">
                                <input type="number" step="0.01" value={monto} onChange={e=>setMonto(e.target.value)} className="w-full p-4 rounded-xl border border-border bg-background outline-none text-primary font-bold text-2xl text-center"/>
                                <select value={cat} onChange={e=>setCat(e.target.value)} className="w-full p-3.5 rounded-xl border border-border bg-background outline-none text-primary text-sm font-bold">{CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}</select>
                                <input type="text" value={desc} onChange={e=>setDesc(e.target.value)} className="w-full p-3.5 rounded-xl border border-border bg-background outline-none text-primary text-sm"/>
                                <button type="submit" className="w-full py-4 bg-accent text-white rounded-xl font-bold text-sm shadow-lg shadow-accent/30 mt-4">Guardar Cambios</button>
                            </form>
                        </div>
                    </div>
                );
            };

            return (
                <div className="p-4 space-y-4 view-animate">
                    <TopHeader title="Historial" user={user} isVip={isVip} onOpenSettings={onOpenSettings} />
                    <CurrencyTabs currencies={curList} activeCurrency={cur} setActiveCurrency={setCur} />

                    <div className="bg-card rounded-3xl p-5 border border-border shadow-md">
                        <div className="flex justify-between items-center mb-4">
                            <button onClick={() => changeMonth(-1)} className="text-secondary hover:text-primary p-2 bg-background rounded-full border border-border"><Icons.ChevronLeft c="w-4 h-4"/></button>
                            <span className="font-bold text-primary tracking-wide">{MESES[month]} {year}</span>
                            <button onClick={() => changeMonth(1)} className="text-secondary hover:text-primary p-2 bg-background rounded-full border border-border"><Icons.ChevronRight c="w-4 h-4"/></button>
                        </div>
                        <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-secondary mb-2 uppercase">
                            <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
                        </div>
                        <div className="grid grid-cols-7 gap-y-2 gap-x-1 text-center text-sm font-medium">
                            {Array.from({length: firstDay}).map((_, i) => <div key={`blank-${i}`}></div>)}
                            {Array.from({length: daysInMonth}).map((_, i) => {
                                const d = i + 1; const hasDot = checkDayHasTxns(d); const isSelected = selectedDay === d;
                                return (
                                    <div key={d} onClick={() => { setSelectedDay(d); setFiltro('Diario'); }} className="relative flex justify-center cursor-pointer group py-1">
                                        <div className={`w-8 h-8 flex items-center justify-center rounded-full transition-all ${isSelected ? 'bg-accent text-white font-bold shadow-lg scale-110' : 'text-secondary group-hover:bg-border group-hover:text-white'}`}>{d}</div>
                                        {hasDot && <span className={`absolute bottom-0 w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-accent'}`}></span>}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="flex bg-card rounded-xl border border-border p-1 shadow-sm">
                        {['Diario', 'Semanal', 'Mensual'].map(f => (
                            <button key={f} onClick={() => { setFiltro(f); if(f!=='Diario') setSelectedDay(null); }} className={`flex-1 py-2.5 text-xs rounded-lg font-bold transition-all ${filtro === f ? 'bg-background text-primary shadow-sm border border-border' : 'text-secondary hover:text-primary'}`}>{f}</button>
                        ))}
                    </div>

                    <div className="flex justify-between items-center text-[10px] font-bold text-secondary uppercase tracking-widest mt-6 mb-2 bg-background p-2.5 rounded-lg border border-border">
                        <span>{label}</span>
                        <div className="flex gap-4"><span className="text-success">+{formatMoneda(inTotal, cur)}</span><span className="text-error">-{formatMoneda(outTotal, cur)}</span></div>
                    </div>

                    <div className="space-y-3">
                        {displayTxns.length === 0 ? <p className="text-center text-secondary py-10 text-sm font-medium">{t('no_txns')}</p> : 
                        displayTxns.map(txn => (
                            <div key={txn.id} className="flex justify-between items-center p-4 bg-card rounded-3xl border border-border shadow-sm group hover:border-accent transition-colors">
                                <div className="flex items-center gap-4">
                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 ${txn.type === 'ingreso' ? 'bg-success/10 text-success' : 'bg-error/10 text-error'}`}>
                                        {txn.type === 'ingreso' ? <Icons.Home c="w-6 h-6"/> : <Icons.List c="w-6 h-6"/>}
                                    </div>
                                    <div>
                                        <p className="font-bold text-sm text-primary mb-0.5">{txn.description}</p>
                                        <p className="text-[10px] text-secondary font-medium uppercase tracking-wider">{txn.category} • {new Date(txn.date).toLocaleDateString()}</p>
                                    </div>
                                </div>
                                <div className="flex flex-col items-end gap-2">
                                    <span className={`font-bold text-sm ${txn.type==='ingreso'?'text-success':'text-error'}`}>
                                        {txn.type==='ingreso'?'+':'-'}{formatMoneda(txn.amount, cur)}
                                    </span>
                                    <div className="flex items-center gap-1.5 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                                        <button onClick={()=>setEditingTxn(txn)} className="p-1.5 text-secondary hover:text-accent bg-background rounded-lg border border-border shadow-sm"><Icons.Pencil c="w-3.5 h-3.5"/></button>
                                        <button onClick={()=>deleteTxn(txn.id)} className="p-1.5 text-secondary hover:text-error bg-background rounded-lg border border-border shadow-sm"><Icons.Trash c="w-3.5 h-3.5"/></button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                    {editingTxn && <EditModal txn={editingTxn} onClose={()=>setEditingTxn(null)} />}
                </div>
            );
        }

        // --- PANTALLA 5: AJUSTES (MODAL FLOTANTE) ---
        function AjustesModal({ onClose, settings, saveSettings, user, isVip, onLogout, onUpgrade }) {
            const [local, setLocal] = useState(settings);
            const [code, setCode] = useState(''); const [crm, setCrm] = useState(false);
            const prof = DB.getUserData(user)?.profile;

            const chgCountry = (e) => {
                const cName = e.target.value; const cData = COUNTRIES.find(x => x.name === cName);
                if(cData) { const nc = [...local.currencies]; nc[0] = cData.defaultCurr; setLocal({...local, country: cName, lang: cData.lang, currencies: nc}); }
            };

            const chgCurr = (index, val) => { const nc = [...local.currencies]; nc[index] = val; setLocal({...local, currencies: nc}); };

            const chgTheme = (t) => {
                if(t==='dark') setLocal({...local, theme:'dark', colors: DEFAULT_SETTINGS.colors});
                else setLocal({...local, theme:'light', colors: { bg:'#f4f4f5', card:'#ffffff', text:'#18181b', secondary:'#71717a', border:'#e4e4e7', accent:'#2563eb', navBg:'#ffffff', navActiveBg:'#e4e4e7', navActiveText:'#2563eb' }});
            };

            const backup = async () => {
                const p = prompt("Crea una clave para encriptar tu respaldo:"); if(!p) return;
                const ud = DB.getUserData(user);
                const payload = { txns: DB.getTxns(user), settings: local, vip: ud.vip, expireAt: ud.expireAt };
                const d = CryptoJS.AES.encrypt(JSON.stringify(payload), p).toString();
                try {
                    await navigator.clipboard.writeText(d);
                    window.open(`https://wa.me/?text=${encodeURIComponent("Mi código seguro Billetera:\n" + d)}`);
                } catch(e) { alert("Copia este código manualmente:\n\n" + d); }
            };

            const restore = () => {
                if(!code) return alert("Pega el código."); const p = prompt("Clave de cifrado:"); if(!p) return;
                try {
                    const dec = CryptoJS.AES.decrypt(code, p).toString(CryptoJS.enc.Utf8);
                    if(dec && confirm("⚠️ ¿Sobrescribir datos y restaurar tu cuenta?")) { 
                        const data = JSON.parse(dec);
                        if (Array.isArray(data)) { DB.saveTxns(user, data); } else {
                            if(data.txns) DB.saveTxns(user, data.txns);
                            if(data.settings) DB.saveSettings(user, data.settings);
                            if(data.vip && data.expireAt) DB.activateVip(user, data.expireAt);
                        }
                        alert("✅ Restauración completada exitosamente."); window.location.reload(); 
                    }
                } catch(e) { alert("❌ Error: Clave incorrecta o código dañado."); }
            };

            const redeem = () => {
                const c = prompt("Ingresa el código VIP:"); if(!c) return; const cl = c.trim().toUpperCase();
                if(cl === 'SIRQCHO-ADMIN') return setCrm(true);
                if(!cl.includes('-')) return alert("Código inválido.");
                const [dStr, hash] = cl.split('-');
                if(hash === CryptoJS.SHA256(user.toLowerCase().trim() + dStr + "Billetera_Carlos_Secreta_195").toString().substring(0,6).toUpperCase()) {
                    const fDate = `${dStr.substring(0,4)}-${dStr.substring(4,6)}-${dStr.substring(6,8)}`;
                    if(fDate < new Date().toISOString().split('T')[0]) return alert("El código caducó.");
                    DB.activateVip(user, fDate); alert("VIP Activado!"); window.location.reload();
                } else alert("Código inválido para este correo.");
            };

            return (
                <div className="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-[200]">
                    <div className="bg-card w-full max-w-lg rounded-3xl p-6 border border-border shadow-2xl relative max-h-[90vh] overflow-y-auto flex flex-col view-animate">
                        <button onClick={onClose} className="absolute top-4 right-4 bg-background border border-border rounded-full p-1.5 text-secondary hover:text-white transition z-10"><Icons.X c="w-5 h-5"/></button>
                        
                        {crm && <AdminCRMModal onClose={()=>setCrm(false)} cur={local.currencies[0]}/>}
                        
                        <h1 className="text-2xl font-extrabold text-primary mb-6">Ajustes Globales</h1>
                        
                        <div className="bg-background p-6 rounded-3xl border border-border shadow-inner mb-6">
                            <div className="flex items-center gap-4 mb-6">
                                {prof?.picture ? <img src={prof.picture} className="w-14 h-14 rounded-full border-2 border-border shadow-md" alt="Avatar"/> : <div className="w-14 h-14 bg-card rounded-full border border-border flex items-center justify-center font-bold text-xl shadow-md">U</div>}
                                <div>
                                    <p className="font-bold text-primary text-lg leading-tight">{prof?.name||user}</p>
                                    <p className="text-xs text-secondary mb-2">{user}</p>
                                    {isVip ? <span className="bg-warning/20 text-warning px-2 py-0.5 rounded text-[10px] font-bold tracking-widest border border-warning/30">USUARIO VIP</span> : <span className="bg-accent/20 text-accent px-2 py-0.5 rounded text-[10px] font-bold tracking-widest border border-accent/30">USUARIO FREE</span>}
                                </div>
                            </div>
                            
                            <button onClick={redeem} className={`w-full bg-warning/10 text-warning border border-warning/30 p-3.5 rounded-xl font-bold text-sm mb-3 shadow-sm hover:bg-warning hover:text-black transition ${isVip ? 'opacity-80' : ''}`}>
                                👑 {isVip ? 'Renovar / Ingresar Nuevo Código VIP' : 'Canjear Código VIP'}
                            </button>
                            
                            <button onClick={onLogout} className="w-full bg-card border border-error/50 text-error p-3.5 rounded-xl font-bold text-sm hover:bg-error hover:text-white transition flex items-center justify-center gap-2"><Icons.LogOut c="w-4 h-4"/> Cerrar Sesión</button>
                        </div>

                        <div className="space-y-6">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="text-[10px] font-bold text-secondary uppercase mb-2 block tracking-widest">País de Residencia</label>
                                    <select value={local.country} onChange={chgCountry} className="w-full p-3 rounded-xl border border-border bg-background outline-none text-primary text-sm font-bold shadow-inner">
                                        {COUNTRIES.map(c=><option key={c.name} value={c.name}>{c.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-secondary uppercase mb-2 block tracking-widest">Tema Visual</label>
                                    <div className="flex bg-background border border-border p-1 rounded-xl shadow-inner">
                                        <button onClick={()=>chgTheme('dark')} className={`flex-1 p-2 rounded-lg font-bold text-xs ${local.theme==='dark'?'bg-accent text-white shadow-md':'text-secondary'}`}>Oscuro</button>
                                        <button onClick={()=>chgTheme('light')} className={`flex-1 p-2 rounded-lg font-bold text-xs ${local.theme==='light'?'bg-accent text-white shadow-md':'text-secondary'}`}>Claro</button>
                                    </div>
                                </div>
                            </div>

                            <div className="pt-4 border-t border-border">
                                <label className="text-[10px] font-bold text-secondary uppercase mb-3 block tracking-widest">Tus 3 Monedas Favoritas</label>
                                <div className="grid grid-cols-3 gap-3">
                                    {[0, 1, 2].map(i => (
                                        <select key={i} value={local.currencies[i] || ''} onChange={e => chgCurr(i, e.target.value)} className="w-full p-3 rounded-xl border border-border bg-background outline-none text-primary text-xs font-bold text-center appearance-none shadow-inner">
                                            <option value="">{i===0?'Principal':`Opción ${i+1}`}</option>
                                            {Object.keys(ALL_CURRENCIES).map(code => <option key={code} value={code}>{code}</option>)}
                                        </select>
                                    ))}
                                </div>
                            </div>

                            <div className="pt-4 border-t border-border relative">
                                {!isVip && <div className="absolute inset-0 glass-panel z-10 flex justify-center items-center rounded-2xl"><button onClick={() => { onClose(); onUpgrade(); }} className="bg-warning text-black font-bold px-4 py-2 rounded-lg text-xs shadow-[0_0_15px_rgba(234,179,8,0.5)] flex items-center gap-1"><Icons.Crown c="w-4 h-4"/> Solo VIP</button></div>}
                                <label className="text-[10px] font-bold text-secondary uppercase mb-3 block tracking-widest">Personalizar Colores</label>
                                <div className="flex justify-between gap-3">
                                    {['bg','card','accent'].map(k => <div key={k} className="flex-1"><input type="color" value={local.colors[k]} onChange={e=>setLocal({...local, colors:{...local.colors, [k]:e.target.value}})} className="w-full h-10 rounded-lg cursor-pointer border border-border shadow-sm"/><p className="text-[9px] font-bold uppercase text-center mt-1 text-secondary">{k}</p></div>)}
                                </div>
                            </div>

                            <div className="pt-4 border-t border-border">
                                <label className="text-[10px] font-bold text-success uppercase mb-3 flex items-center gap-1.5 tracking-widest"><Icons.Shield c="w-4 h-4"/> Respaldo Cifrado (AES-256)</label>
                                <button onClick={backup} className="w-full bg-success/10 text-success border border-success/30 p-3.5 rounded-xl font-bold text-sm mb-4 shadow-sm hover:bg-success hover:text-white transition">↑ Enviar a WhatsApp</button>
                                <div className="bg-background p-2 rounded-xl border border-border flex items-center gap-2 shadow-inner">
                                    <input type="text" value={code} onChange={e=>setCode(e.target.value)} className="flex-1 p-2 bg-transparent outline-none text-xs text-primary font-mono" placeholder="Pega el código aquí"/>
                                    <button onClick={restore} className="bg-card border border-border text-primary px-4 py-2 rounded-lg font-bold text-xs hover:bg-accent hover:text-white transition shadow-sm">↓ Restaurar</button>
                                </div>
                            </div>

                            <button onClick={()=>{saveSettings(local); onClose();}} className="w-full bg-accent text-white p-4 rounded-xl font-bold mt-2 shadow-lg shadow-accent/30 text-lg">Guardar Todo y Cerrar</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- APP PRINCIPAL ---
        function App() {
            const [user, setUser] = useState(null);
            const [vip, setVip] = useState(false); const [exp, setExp] = useState(null);
            const [view, setView] = useState('home'); const [showPay, setShowPay] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [txns, setTxns] = useState([]); const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [cur, setCur] = useState('PEN');

            useEffect(() => { const sUser = sessionStorage.getItem('billetera_active_user'); if(sUser) loadData(sUser); }, []);

            const loadData = (u) => {
                setUser(u); const ud = DB.getUserData(u);
                if(ud?.vip && ud.expireAt && ud.expireAt >= new Date().toISOString().split('T')[0]) { setVip(true); setExp(ud.expireAt); }
                else { DB.deactivateVip(u); setVip(false); setExp(null); }
                setTxns(DB.getTxns(u)); const s = DB.getSettings(u); setSettings(s); setCur(s.currencies[0]||'PEN'); setView('home');
            };

            const login = (u, p) => { sessionStorage.setItem('billetera_active_user', u); DB.loginOrRegisterGoogle(u, p); loadData(u); };
            const logout = () => { sessionStorage.removeItem('billetera_active_user'); setUser(null); setShowSettings(false); };

            if(!user) return <div style={{'--col-bg':'#111111','--col-card':'#1e1e1e','--col-border':'#27272a'}}><AuthView onLogin={login}/></div>;

            const t = (k) => DICTIONARY[settings.lang]?.[k] || DICTIONARY['es'][k];
            const renderV = () => {
                switch(view) {
                    case 'home': return <Dashboard txns={txns} cur={cur} setActiveCurrency={setCur} settings={settings} t={t} isVip={vip} user={user} onOpenSettings={()=>setShowSettings(true)} expire={exp}/>;
                    case 'nueva': return <RegistroUnificado addTxn={x=>{const nw=[...txns,x];setTxns(nw);DB.saveTxns(user,nw);}} cur={cur} t={t} isVip={vip} user={user} onOpenSettings={()=>setShowSettings(true)} onUpgrade={()=>setShowPay(true)}/>;
                    case 'analisis': return <Analisis txns={txns} cur={cur} t={t} isVip={vip} user={user} onOpenSettings={()=>setShowSettings(true)} onUpgrade={()=>setShowPay(true)}/>;
                    case 'historial': return <Historial txns={txns} cur={cur} setCur={setCur} curList={settings.currencies} deleteTxn={id=>{if(confirm("¿Borrar?")){const nw=txns.filter(x=>x.id!==id);setTxns(nw);DB.saveTxns(user,nw);}}} updateTxn={x=>{const nw=txns.map(t=>t.id===x.id?x:t);setTxns(nw);DB.saveTxns(user,nw);}} t={t} isVip={vip} user={user} onOpenSettings={()=>setShowSettings(true)}/>;
                    default: return <Dashboard txns={txns} cur={cur} setActiveCurrency={setCur} settings={settings} t={t} isVip={vip} user={user} onOpenSettings={()=>setShowSettings(true)} expire={exp}/>;
                }
            };

            const zS = (settings.zoom||100)/100; const c = settings.colors || DEFAULT_SETTINGS.colors;
            return (
                <div className="min-h-screen flex flex-col relative" style={{ '--col-bg':c.bg, '--col-card':c.card, '--col-text':c.text, '--col-secondary':c.secondary, '--col-border':c.border, '--col-accent':c.accent, '--col-nav-bg':c.navBg, '--col-nav-active-bg':c.navActiveBg, '--col-nav-active-text':c.navActiveText }}>
                    <div className="flex-1 pb-28" style={{ transform:`scale(${zS})`, transformOrigin:'top center' }}>{renderV()}</div>
                    
                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-nav-bg/95 backdrop-blur-md rounded-[2rem] flex justify-around px-2 py-3 shadow-[0_10px_40px_rgba(0,0,0,0.5)] border border-border/50 z-40">
                        {[{id:'home', I:Icons.Home, l:'Inicio'},{id:'nueva', I:Icons.Plus, l:'Registrar'},{id:'analisis', I:Icons.Brain, l:'Análisis'},{id:'historial', I:Icons.List, l:'Historial'}].map(x => {
                            const IconComponent = x.I;
                            return (
                                <button key={x.id} onClick={()=>setView(x.id)} className={`flex flex-col items-center justify-center min-w-[4rem] transition-all duration-300 ${view===x.id?'text-nav-active-text scale-110 -translate-y-1':'text-secondary hover:text-primary'}`}>
                                    <IconComponent c="w-6 h-6"/>
                                    <span className={`text-[10px] mt-1.5 font-bold tracking-wide ${view===x.id?'opacity-100':'opacity-0 h-0 overflow-hidden'}`}>{x.l}</span>
                                </button>
                            );
                        })}
                    </div>
                    
                    {showSettings && <AjustesModal settings={settings} saveSettings={s=>{setSettings(s);DB.saveSettings(user,s);setCur(s.currencies[0]);}} user={user} isVip={vip} onLogout={logout} onUpgrade={()=>setShowPay(true)} onClose={()=>setShowSettings(false)}/>}
                    {showPay && <PaymentModal onClose={()=>setShowPay(false)}/>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
