                }
                return { success: true, profile: users[email].profile, vip: users[email].vip, expireAt: users[email].expireAt };
            },
            activateVip: (user, expireDateStr) => {
                const users = DB.getUsers();
                if(users[user]) { users[user].vip = true; users[user].expireAt = expireDateStr; localStorage.setItem('billetera_users_v8', JSON.stringify(users)); return true; } return false;
            },
            deactivateVip: (user) => {
                const users = DB.getUsers();
                if(users[user]) { users[user].vip = false; users[user].expireAt = null; localStorage.setItem('billetera_users_v8', JSON.stringify(users)); }

            saveTxns: (user, txns) => localStorage.setItem(`txns_${user}`, JSON.stringify(txns)),

        // --- COMPONENTE: MODAL DE PAGO VIP ---
        function PaymentModal({ onClose }) {
            const redirectWA = (plan) => window.open(`https://wa.me/51930266472?text=Hola%20Carlos,%20quiero%20pagar%20el%20plan%20VIP%20de%20${plan}`, '_blank');
            return (
                <div className="fixed inset-0 modal-overlay flex items-center justify-center p-4">

                        <h2 className="text-2xl font-bold text-primary mb-2">Desbloquea la IA</h2>

                        <div className="space-y-3 mb-6">
                            <button onClick={()=>redirectWA('1 Mes ($3.00)')} className="w-full bg-[#19191c] border border-border p-3 rounded-xl hover:border-warning transition flex justify-between items-center group">
                                <span className="text-secondary font-bold group-hover:text-white">1 Mes</span><span className="text-white font-extrabold">$3.00</span>
                            </button>

                                <span className="text-warning font-bold">1 Año</span><span className="text-white font-extrabold">$15.00</span>
                            </button>
                            <button onClick={()=>redirectWA('Vitalicio ($45.00)')} className="w-full bg-[#19191c] border border-border p-3 rounded-xl hover:border-warning transition flex justify-between items-center group">
                                <span className="text-secondary font-bold group-hover:text-white">Vitalicio</span><span className="text-white font-extrabold">$45.00</span>
                            </button>
                        </div>

                        <div className="bg-white p-3 rounded-2xl inline-block shadow-xl cursor-pointer" onClick={()=>redirectWA('Suscripción')}>
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://wa.me/51930266472?text=Hola%20Carlos,%20quiero%20pagar%20mi%20suscripcion%20VIP" alt="QR" className="w-32 h-32"/>
                        </div>
                        <p className="text-[10px] text-secondary mt-3">Te enviaré un código de activación único para tu correo tras el pago.</p>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE: PANEL CRM OCULTO (GENERADOR) ---
        function AdminCRMModal({ onClose }) {
            const [clients, setClients] = useState(JSON.parse(localStorage.getItem('billetera_admin_crm') || '[]'));
            const [email, setEmail] = useState('');
            const [plan, setPlan] = useState('30'); // 30, 365, 0 (vitalicio)

            const generateCode = (e) => {
                e.preventDefault(); if(!email) return;
                let expDate = new Date();
                if(plan === '0') expDate = new Date(2099, 11, 31); else expDate.setDate(expDate.getDate() + parseInt(plan));
                
                const dStr = `${expDate.getFullYear()}${String(expDate.getMonth()+1).padStart(2,'0')}${String(expDate.getDate()).padStart(2,'0')}`; 
                const hash = CryptoJS.SHA256(email.toLowerCase().trim() + dStr + "Billetera_Carlos_Secreta_195").toString().substring(0,6).toUpperCase();
                const code = `${dStr}-${hash}`;
                
                const nc = { id: Date.now(), email: email.toLowerCase(), code, expires: expDate.toISOString().split('T')[0], plan: plan==='0'?'Vitalicio':`${plan}d` };
                const upd = [nc, ...clients]; setClients(upd); localStorage.setItem('billetera_admin_crm', JSON.stringify(upd)); setEmail('');
                alert(`✅ ENVIAR ESTE CÓDIGO AL CLIENTE:\n\n${code}`);
            };

            return (
                <div className="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-[300]">
                    <div className="bg-card w-full max-w-2xl rounded-3xl p-6 border border-border shadow-2xl relative max-h-[90vh] flex flex-col">

                        <h2 className="text-xl font-bold text-warning mb-4">👑 Panel CRM Ventas</h2>
                        <form onSubmit={generateCode} className="flex gap-2 mb-6 bg-background p-3 rounded-xl border border-border">
                            <input type="text" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="Correo Google del cliente" className="flex-1 p-2 rounded-lg bg-card border border-border text-sm text-primary outline-none"/>
                            <select value={plan} onChange={e=>setPlan(e.target.value)} className="p-2 rounded-lg bg-card border border-border text-sm text-primary outline-none">
                                <option value="30">1 Mes ($3)</option><option value="365">1 Año ($15)</option><option value="0">Vitalicio ($45)</option>
                            </select>
                            <button type="submit" className="bg-success text-white font-bold px-4 rounded-lg text-sm">Generar</button>
                        </form>
                        <div className="flex-1 overflow-y-auto space-y-2">
                            {clients.map(c => <div key={c.id} className="bg-background p-3 rounded-lg border border-border text-xs flex justify-between"><div className="text-secondary"><strong className="text-primary text-sm block">{c.email}</strong>Código: <span className="text-warning">{c.code}</span> | Vence: {c.expires}</div></div>)}
                        </div>
                    </div>
                </div>
            );
        }

        // --- PANTALLA: AUTENTICACIÓN GOOGLE EXCLUSIVA ---
        function AuthView({ onLogin }) {
            useEffect(() => {
                const initG = setInterval(() => {
                    if (window.google && window.google.accounts) {
                        window.google.accounts.id.initialize({
                            /* ---------------------------------------------------- */
                            /* PEGA AQUÍ TU ID DE CLIENTE DE GOOGLE REAL            */
                            /* ---------------------------------------------------- */
                            client_id: "PON_TU_CLIENT_ID_DE_GOOGLE_AQUI.apps.googleusercontent.com", 
                            callback: (res) => {
                                try {
                                    const payload = JSON.parse(decodeURIComponent(window.atob(res.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
                                    if(payload && payload.email) onLogin(payload.email, { name: payload.name, picture: payload.picture });
                                } catch(e) { alert("Error de inicio de sesión con Google."); }
                            }
                        });
                        window.google.accounts.id.renderButton(document.getElementById("g-btn"), { theme: "filled_black", size: "large", width: "100%", text: "continue_with" });
                        clearInterval(initG);
                    }
                }, 500);
                return () => clearInterval(initG);
            }, []);

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-[#111111] text-white">
                    <div className="w-24 h-24 rounded-3xl bg-gradient-to-br from-[#3b82f6] to-[#00d2ff] p-5 shadow-2xl shadow-accent/20 mb-8"><Icons.Logo /></div>
                    <h1 className="text-3xl font-extrabold tracking-tight mb-2">Mi Billetera</h1>
                    <p className="text-[#a1a1aa] mb-12 text-center max-w-xs">Controla tus finanzas personales con inteligencia artificial. Seguro y privado.</p>
                    <div className="w-full max-w-xs p-6 bg-[#1e1e1e] rounded-3xl border border-[#27272a] shadow-xl text-center">
                        <p className="text-xs font-bold uppercase text-[#a1a1aa] tracking-widest mb-6">Acceso Seguro</p>
                        <div id="g-btn" className="w-full overflow-hidden rounded-xl h-12"></div>
                        <p className="text-[10px] text-[#a1a1aa] mt-4 leading-relaxed">Al ingresar aceptas que tus datos se guarden únicamente de forma local en tu dispositivo.</p>
                    </div>
                </div>
            );
        }

        // --- PANTALLAS DE USUARIO ---
        function Dashboard({ txns, cur, t, isVip, user, setView, expire }) {
            const m = txns.filter(x => x.currency === cur);
            const inC = m.filter(x=>x.type==='ingreso').reduce((a,b)=>a+b.amount,0);
            const outC = m.filter(x=>x.type==='gasto').reduce((a,b)=>a+b.amount,0);
            const bal = inC - outC;
            const target = inC * 0.2; const pct = target>0 ? Math.min(Math.round((bal/target)*100),100) : (bal>0?100:0);
            const prof = DB.getUserData(user)?.profile;

            return (
                <div className="p-4 space-y-4 view-animate">
                    <div className="flex justify-between items-center pt-2">
                        <div>
                            <p className="text-secondary text-sm">Hola, <strong className="text-primary">{prof?.name?.split(' ')[0]||'Usuario'}</strong></p>
                            <h1 className="text-xl font-extrabold text-primary">Mi Resumen</h1>
                        </div>
                        <button onClick={()=>setView('ajustes')} className="w-10 h-10 rounded-full border-2 border-border overflow-hidden relative">
                            {prof?.picture ? <img src={prof.picture}/> : <div className="w-full h-full bg-accent flex items-center justify-center font-bold">U</div>}
                            {isVip && <div className="absolute -bottom-1 -right-1 bg-warning text-black rounded-full w-4 h-4 flex items-center justify-center border border-card"><Icons.Crown c="w-2.5 h-2.5"/></div>}
                        </button>
                    </div>

                    <div className="bg-gradient-to-br from-card to-background rounded-3xl p-6 border border-border shadow-lg relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icons.Logo/></div>
                        <p className="text-secondary text-sm font-medium">{t('balance')} ({cur})</p>
                        <p className="text-4xl font-extrabold text-white mt-1 mb-6">{formatMoneda(bal, cur)}</p>
                        <div className="flex gap-4">
                            <div className="flex-1 bg-success/10 border border-success/20 rounded-2xl p-3"><p className="text-[10px] text-success font-bold uppercase">Ingresos</p><p className="text-success font-bold text-lg">+{formatMoneda(inC, cur)}</p></div>
                            <div className="flex-1 bg-error/10 border border-error/20 rounded-2xl p-3"><p className="text-[10px] text-error font-bold uppercase">Gastos</p><p className="text-error font-bold text-lg">-{formatMoneda(outC, cur)}</p></div>
                        </div>
                    </div>

                    <div className="bg-card rounded-3xl p-5 border border-border shadow-md">
                        <div className="flex justify-between mb-3"><p className="font-bold text-primary text-sm">{t('save')}</p><p className="font-bold text-accent text-sm">{pct}%</p></div>
                        <div className="w-full bg-background rounded-full h-3 mb-2"><div className="bg-accent h-3 rounded-full transition-all" style={{width:`${pct}%`}}></div></div>
                        <div className="flex justify-between text-xs text-secondary"><p>Actual: {formatMoneda(bal, cur)}</p><p>Meta (20%): {formatMoneda(target, cur)}</p></div>
                    </div>
                </div>
            );
        }

        function RegistroUnificado({ addTxn, cur, t, isVip, setView, onUpgrade }) {
            const [tipo, setTipo] = useState('gasto'); const [monto, setMonto] = useState(''); const [cat, setCat] = useState(CATEGORIAS[0]); const [desc, setDesc] = useState('');
            const [iaMode, setIaMode] = useState('texto'); const [iaMsg, setIaMsg] = useState(''); const [escuchando, setEscuchando] = useState(false);
            const recRef = useRef(null);

            const guardarManual = (e) => {
                e.preventDefault(); if(!monto || isNaN(monto) || monto<=0) return;
                addTxn({ id: Date.now(), type: tipo, amount: parseFloat(monto), category: cat, description: desc||cat, date: new Date().toISOString(), currency: cur });
                setMonto(''); setDesc(''); alert("✅ Registrado.");
            };

            const toggleVoz = () => {
                if(escuchando) { recRef.current?.stop(); setEscuchando(false); return; }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if(!SR) return alert("Navegador no soporta voz.");
                const rec = new SR(); rec.lang = 'es-ES'; rec.interimResults = true;
                rec.onresult = (e) => { let txt=""; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript; setIaMsg(txt); };
                rec.onerror = () => setEscuchando(false); rec.onend = () => setEscuchando(false);
                recRef.current = rec; rec.start(); setEscuchando(true);
            };

            const procesarIA = () => {
                if(!iaMsg) return; const txt = iaMsg.toLowerCase();
                const isInc = txt.includes('recibi')||txt.includes('ingreso')||txt.includes('gane'); const type = isInc ? 'ingreso' : 'gasto';
                const nums = txt.match(/\d+(\.\d+)?/); const amount = nums ? parseFloat(nums[0]) : 0;
                if(amount > 0) {
                    let c = "Otros"; CATEGORIAS.forEach(x => { if(txt.includes(x.toLowerCase())) c = x; });
                    addTxn({ id: Date.now(), type, amount, category: c, description: iaMsg, date: new Date().toISOString(), currency: cur });
                    setIaMsg(''); setIaMode('texto'); alert(`🤖 IA: ${type.toUpperCase()} - ${formatMoneda(amount, cur)} (${c}) guardado.`);
                } else alert("🤖 IA: No detecté ningún monto. Ej: 'Gasté 20 en comida'.");
            };

            return (
                <div className="p-4 space-y-6 view-animate pt-6">
                    {/* PARTE 1: MANUAL */}
                    <div className="bg-card rounded-3xl p-5 border border-border shadow-lg">
                        <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><Icons.Plus className="w-5 h-5"/> {t('manual')}</h2>
                        <form onSubmit={guardarManual} className="space-y-4">
                            <div className="flex bg-background rounded-xl p-1 border border-border">
                                <button type="button" onClick={()=>setTipo('gasto')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${tipo==='gasto'?'bg-error text-white':'text-secondary'}`}>Gasto</button>
                                <button type="button" onClick={()=>setTipo('ingreso')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${tipo==='ingreso'?'bg-success text-white':'text-secondary'}`}>Ingreso</button>
                            </div>
                            <input type="number" step="0.01" value={monto} onChange={e=>setMonto(e.target.value)} required className="w-full p-4 rounded-xl border border-border bg-background outline-none text-2xl font-bold text-primary text-center" placeholder="0.00"/>
                            <div className="flex gap-2">
                                <select value={cat} onChange={e=>setCat(e.target.value)} className="w-1/2 p-3 rounded-xl border border-border bg-background outline-none text-sm text-primary">{CATEGORIAS.map(c=><option key={c} value={c}>{c}</option>)}</select>
                                <input type="text" value={desc} onChange={e=>setDesc(e.target.value)} className="w-1/2 p-3 rounded-xl border border-border bg-background outline-none text-sm text-primary" placeholder="Nota"/>
                            </div>
                            <button type="submit" className="w-full py-3.5 bg-accent text-white rounded-xl font-bold shadow-lg shadow-accent/30">{t('btn_save')}</button>
                        </form>
                    </div>

                    {/* PARTE 2: INTELIGENCIA ARTIFICIAL */}
                    <div className="relative bg-card rounded-3xl p-5 border border-border shadow-lg overflow-hidden">
                        <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-warning"><Icons.Brain className="w-5 h-5"/> {t('ai')}</h2>
                        
                        {!isVip && (
                            <div className="absolute inset-0 z-10 glass-panel flex flex-col items-center justify-center text-center p-6">
                                <div className="w-12 h-12 bg-warning/20 text-warning rounded-full flex items-center justify-center mb-3"><Icons.Crown c="w-6 h-6"/></div>
                                <h3 className="font-bold text-white mb-2">Desbloquea la Inteligencia Artificial</h3>
                                <p className="text-xs text-secondary mb-4">Registra tus gastos hablándole a tu teléfono. Súper rápido.</p>
                                <button onClick={onUpgrade} className="bg-warning text-black font-bold px-6 py-2.5 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.4)]">Ver Planes VIP</button>
                            </div>
                        )}

                        <div className={!isVip ? "opacity-30 pointer-events-none filter blur-sm" : ""}>
                            <div className="flex bg-background rounded-xl p-1 mb-4 border border-border">
                                <button onClick={()=>{setIaMode('texto'); if(escuchando) toggleVoz();}} className={`flex-1 py-2 rounded-lg font-bold text-sm ${iaMode==='texto'?'bg-card text-primary':'text-secondary'}`}>Escribir</button>
                                <button onClick={()=>setIaMode('voz')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${iaMode==='voz'?'bg-card text-primary':'text-secondary'}`}>Hablar</button>
                            </div>
                            
                            {iaMode === 'texto' ? (
                                <div>
                                    <textarea value={iaMsg} onChange={e=>setIaMsg(e.target.value)} className="w-full p-4 border border-border rounded-xl mb-3 bg-background outline-none text-sm text-primary" rows="3" placeholder="Ej: Me pagaron 500 de salario..."></textarea>
                                    <button onClick={procesarIA} className="w-full py-3 bg-[#19191c] border border-warning/50 text-warning rounded-xl font-bold">Procesar con IA</button>
                                </div>
                            ) : (
                                <div className="flex flex-col items-center py-4">
                                    <button onClick={toggleVoz} className={`w-20 h-20 rounded-full flex items-center justify-center border-2 transition-all duration-300 ${escuchando ? 'bg-error/20 border-error text-error scale-110' : 'bg-background border-warning text-warning'}`}>
                                        {escuchando ? <Icons.MicOff /> : <Icons.Mic />}
                                    </button>
                                    <p className="text-xs text-secondary mt-4 mb-2">{escuchando ? "Escuchando... presiona para detener" : "Toca el micro para hablar"}</p>
                                    {iaMsg && <div className="w-full mt-2"><div className="p-3 bg-background rounded-lg border border-border text-xs text-primary mb-3">"{iaMsg}"</div>{!escuchando && <button onClick={procesarIA} className="w-full py-3 bg-warning text-black rounded-xl font-bold">Analizar Texto</button>}</div>}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Historial({ txns, cur, setCur, curList, deleteTxn }) {
            const m = txns.filter(t => t.currency === cur).reverse();
            return (
                <div className="p-4 space-y-4 view-animate pt-6">
                    <h1 className="text-xl font-extrabold text-primary mb-4">Historial</h1>
                    <CurrencyTabs currencies={curList} activeCurrency={cur} setActiveCurrency={setCur} />
                    <div className="space-y-3">
                        {m.length===0 ? <p className="text-center text-secondary py-10 text-sm">No hay registros.</p> :
                         m.map(t => (
                            <div key={t.id} className="bg-card p-4 rounded-2xl border border-border shadow-sm flex justify-between items-center group">
                                <div className="flex items-center gap-3">
                                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${t.type==='ingreso'?'bg-success/10 text-success':'bg-error/10 text-error'}`}>{t.type==='ingreso'?<Icons.Home className="w-5 h-5"/>:<Icons.List className="w-5 h-5"/>}</div>
                                    <div><p className="font-bold text-sm text-primary">{t.description}</p><p className="text-[10px] text-secondary">{t.category} • {new Date(t.date).toLocaleDateString()}</p></div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <span className={`font-bold ${t.type==='ingreso'?'text-success':'text-error'}`}>{t.type==='ingreso'?'+':'-'}{formatMoneda(t.amount, cur)}</span>
                                    <button onClick={()=>deleteTxn(t.id)} className="text-secondary hover:text-error p-1"><Icons.Trash/></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Ajustes({ settings, saveSettings, user, isVip, onLogout, onUpgrade }) {
            const [local, setLocal] = useState(settings);
            const [code, setCode] = useState(''); const [crm, setCrm] = useState(false);
            const prof = DB.getUserData(user)?.profile;

            const chgCountry = (e) => {
                const cName = e.target.value; const cData = COUNTRIES.find(x => x.name === cName);
                if(cData) { const nc = [...local.currencies]; nc[0] = cData.defaultCurr; setLocal({...local, country: cName, lang: cData.lang, currencies: nc}); }
            };

            const chgTheme = (t) => {
                if(t==='dark') setLocal({...local, theme:'dark', colors: DEFAULT_SETTINGS.colors});
                else setLocal({...local, theme:'light', colors: { bg:'#f4f4f5', card:'#ffffff', text:'#18181b', secondary:'#71717a', border:'#e4e4e7', accent:'#2563eb', navBg:'#ffffff', navActiveBg:'#e4e4e7', navActiveText:'#2563eb' }});
            };

            const backup = async () => {
                const p = prompt("Crea una clave para encriptar tu respaldo:"); if(!p) return;
                const d = CryptoJS.AES.encrypt(JSON.stringify(DB.getTxns(user)), p).toString();
                await navigator.clipboard.writeText(d);
                window.open(`https://wa.me/?text=${encodeURIComponent("Mi código seguro Billetera:\n" + d)}`);
            };

            const restore = () => {
                if(!code) return alert("Pega el código."); const p = prompt("Clave de cifrado:"); if(!p) return;
                try {
                    const dec = CryptoJS.AES.decrypt(code, p).toString(CryptoJS.enc.Utf8);
                    if(dec && confirm("¿Sobrescribir datos?")) { DB.saveTxns(user, JSON.parse(dec)); window.location.reload(); }
                } catch(e) { alert("Error al descifrar."); }
            };

            const redeem = () => {
                const c = prompt("Ingresa el código VIP:"); if(!c) return; const cl = c.trim().toUpperCase();
                if(cl === 'SIRQCHO-ADMIN') return setCrm(true);
                if(!cl.includes('-')) return alert("Código inválido.");
                const [dStr, hash] = cl.split('-');
                if(hash === CryptoJS.SHA256(user.toLowerCase().trim() + dStr + "Billetera_Carlos_Secreta_195").toString().substring(0,6).toUpperCase()) {
                    const fDate = `${dStr.substring(0,4)}-${dStr.substring(4,6)}-${dStr.substring(6,8)}`;
                    if(fDate < new Date().toISOString().split('T')[0]) return alert("El código caducó.");
                    DB.activateVip(user, fDate); alert("VIP Activado!"); window.location.reload();
                } else alert("Código inválido para este correo.");
            };

            return (
                <div className="p-4 space-y-6 view-animate pt-6">
                    {crm && <AdminCRMModal onClose={()=>setCrm(false)}/>}
                    <h1 className="text-2xl font-extrabold text-primary mb-4">Ajustes Globales</h1>
                    
                    <div className="bg-card p-5 rounded-3xl border border-border shadow-lg">
                        <div className="flex items-center gap-4 mb-4">
                            {prof?.picture && <img src={prof.picture} className="w-12 h-12 rounded-full border-2 border-accent"/>}
                            <div><p className="font-bold text-primary">{prof?.name||user}</p><p className="text-xs text-secondary">{user}</p></div>
                        </div>
                        {!isVip ? <button onClick={redeem} className="w-full bg-warning/10 text-warning border border-warning/30 p-3 rounded-xl font-bold text-sm mb-3">👑 Canjear Código VIP</button> : <div className="text-xs text-warning bg-warning/10 p-2 rounded text-center mb-3 font-bold">USUARIO VIP ACTIVO</div>}
                        <button onClick={onLogout} className="w-full bg-background border border-error/50 text-error p-3 rounded-xl font-bold text-sm">Cerrar Sesión</button>
                    </div>

                    <div className="bg-card p-5 rounded-3xl border border-border shadow-lg space-y-5">
                        <div>
                            <label className="text-xs font-bold text-secondary uppercase mb-2 block">País de Residencia</label>
                            <select value={local.country} onChange={chgCountry} className="w-full p-3 rounded-xl border border-border bg-background outline-none text-primary text-sm">
                                {COUNTRIES.map(c=><option key={c.name} value={c.name}>{c.name}</option>)}
                            </select>
                        </div>
                        
                        <div>
                            <label className="text-xs font-bold text-secondary uppercase mb-2 block">Tema</label>
                            <div className="flex gap-2">
                                <button onClick={()=>chgTheme('dark')} className={`flex-1 p-2 rounded-lg font-bold text-sm ${local.theme==='dark'?'bg-accent text-white':'bg-background'}`}>Oscuro</button>
                                <button onClick={()=>chgTheme('light')} className={`flex-1 p-2 rounded-lg font-bold text-sm ${local.theme==='light'?'bg-accent text-white':'bg-background'}`}>Claro</button>
                            </div>
                        </div>

                        <div className="pt-4 border-t border-border relative">
                            {!isVip && <div className="absolute inset-0 glass-panel z-10 flex justify-center items-center rounded-xl"><button onClick={onUpgrade} className="bg-warning text-black font-bold px-4 py-1.5 rounded text-xs shadow-lg">Solo VIP</button></div>}
                            <label className="text-xs font-bold text-secondary uppercase mb-2 block">Personalizar Colores</label>
                            <div className="flex justify-between gap-2">
                                {['bg','card','accent'].map(k => <div key={k} className="flex-1"><input type="color" value={local.colors[k]} onChange={e=>setLocal({...local, colors:{...local.colors, [k]:e.target.value}})} className="w-full h-8 rounded cursor-pointer"/><p className="text-[10px] text-center mt-1 text-secondary">{k}</p></div>)}
                            </div>
                        </div>

                        <div className="pt-4 border-t border-border">
                            <label className="text-xs font-bold text-secondary uppercase mb-2 block">Respaldo Cifrado (AES-256)</label>
                            <button onClick={backup} className="w-full bg-success/10 text-success p-3 rounded-xl font-bold text-sm mb-3">↑ Enviar a WhatsApp</button>
                            <textarea value={code} onChange={e=>setCode(e.target.value)} className="w-full p-3 bg-background border border-border rounded-xl text-xs mb-2 outline-none text-primary" rows="2" placeholder="Pega el código de WhatsApp aquí"></textarea>
                            <button onClick={restore} className="w-full bg-background border border-border text-primary p-3 rounded-xl font-bold text-sm">↓ Restaurar Datos</button>
                        </div>

                        <button onClick={()=>{saveSettings(local); setView('home');}} className="w-full bg-accent text-white p-4 rounded-xl font-bold mt-4 shadow-lg shadow-accent/30">Guardar Todo</button>
                    </div>
                </div>
            );
        }

        // --- APP PRINCIPAL ---
        function App() {
            const [user, setUser] = useState(null);
            const [vip, setVip] = useState(false); const [exp, setExp] = useState(null);
            const [view, setView] = useState('home'); const [showPay, setShowPay] = useState(false);
            const [txns, setTxns] = useState([]); const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [cur, setCur] = useState('PEN');

            useEffect(() => { const sUser = sessionStorage.getItem('billetera_active_user'); if(sUser) loadData(sUser); }, []);

            const loadData = (u) => {
                setUser(u); const ud = DB.getUserData(u);
                if(ud?.vip && ud.expireAt && ud.expireAt >= new Date().toISOString().split('T')[0]) { setVip(true); setExp(ud.expireAt); }
                else { DB.deactivateVip(u); setVip(false); setExp(null); }
                setTxns(DB.getTxns(u)); const s = DB.getSettings(u); setSettings(s); setCur(s.currencies[0]||'PEN'); setView('home');
            };

            const login = (u, p) => { sessionStorage.setItem('billetera_active_user', u); DB.loginOrRegisterGoogle(u, p); loadData(u); };
            const logout = () => { sessionStorage.removeItem('billetera_active_user'); setUser(null); };

            if(!user) return <div style={{'--col-bg':'#111111','--col-card':'#1e1e1e','--col-border':'#27272a'}}><AuthView onLogin={login}/></div>;

            const t = (k) => DICTIONARY[settings.lang]?.[k] || DICTIONARY['es'][k];
            const renderV = () => {
                switch(view) {
                    case 'home': return <Dashboard txns={txns} cur={cur} t={t} isVip={vip} user={user} setView={setView} expire={exp}/>;
                    case 'nueva': return <RegistroUnificado addTxn={x=>{const nw=[...txns,x];setTxns(nw);DB.saveTxns(user,nw);}} cur={cur} t={t} isVip={vip} setView={setView} onUpgrade={()=>setShowPay(true)}/>;
                    case 'historial': return <Historial txns={txns} cur={cur} setCur={setCur} curList={settings.currencies} deleteTxn={id=>{const nw=txns.filter(x=>x.id!==id);setTxns(nw);DB.saveTxns(user,nw);}}/>;
                    case 'ajustes': return <Ajustes settings={settings} saveSettings={s=>{setSettings(s);DB.saveSettings(user,s);setCur(s.currencies[0]);}} user={user} isVip={vip} onLogout={logout} onUpgrade={()=>setShowPay(true)}/>;
                    default: return <Dashboard txns={txns} cur={cur} t={t} isVip={vip} user={user} setView={setView} expire={exp}/>;
                }
            };

            const zS = (settings.zoom||100)/100; const c = settings.colors;
            return (
                <div className="min-h-screen flex flex-col relative" style={{ '--col-bg':c.bg, '--col-card':c.card, '--col-text':c.text, '--col-secondary':c.secondary, '--col-border':c.border, '--col-accent':c.accent, '--col-nav-bg':c.navBg, '--col-nav-active-bg':c.navActiveBg, '--col-nav-active-text':c.navActiveText }}>
                    <div className="flex-1 pb-24" style={{ transform:`scale(${zS})`, transformOrigin:'top center' }}>{renderV()}</div>
                    {view!=='ajustes' && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-nav-bg/90 backdrop-blur-md rounded-2xl flex justify-around px-2 py-3 shadow-2xl border border-border z-50">
                            {[{id:'home', I:Icons.Home, l:'Inicio'},{id:'nueva', I:Icons.Plus, l:'Registrar'},{id:'historial', I:Icons.List, l:'Historial'}].map(x => 
                                <button key={x.id} onClick={()=>setView(x.id)} className={`flex flex-col items-center min-w-[4rem] transition-colors ${view===x.id?'text-nav-active-text':'text-secondary'}`}><x.I/><span className="text-[10px] mt-1 font-bold">{x.l}</span></button>
                            )}
                        </div>
                    )}
                    {showPay && <PaymentModal onClose={()=>setShowPay(false)}/>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
