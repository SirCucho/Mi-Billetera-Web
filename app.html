        function AuthView({ onLogin }) {

                        window.google.accounts.id.initialize({
                            /* ---------------------------------------------------- */
                            /* OJO: RECUERDA PONER TU CLIENT ID REAL DE GOOGLE      */
                            /* ---------------------------------------------------- */
                            client_id: "PON_TU_CLIENT_ID_DE_GOOGLE_AQUI.apps.googleusercontent.com", 
                            callback: (res) => {
                                try {
                                    const payload = JSON.parse(decodeURIComponent(window.atob(res.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));

            return (

                    <div className="w-full max-w-xs p-6 bg-[#27272a] rounded-3xl border border-[#3f3f46] shadow-xl text-center">

        // --- COMPONENTE: PESTAÑAS DE MONEDA (FIJAS ARRIBA) ---
        const CurrencyTabs = ({ currencies, activeCurrency, setActiveCurrency, c }) => {

        // --- PANTALLA 1: DASHBOARD ---
        function Dashboard({ txns, cur, setActiveCurrency, settings, t, isVip, user, onOpenSettings, onOpenCountryMenu, expire, formatMoneda, Icons, c }) {
            const catList = Array.isArray(t('categories')) ? t('categories') : ["Salario", "Comida", "Transporte", "Servicios", "Vivienda", "Salud", "Educación", "Entretenimiento", "Inversión", "Otros"];
            const safeTxns = Array.isArray(txns) ? txns : [];
            const m = safeTxns.filter(x => x && x.currency === cur);
            
            const inC = m.filter(x=>x.type==='ingreso').reduce((a,b)=>a+(Number(b.amount)||0),0); 
            const outC = m.filter(x=>x.type==='gasto').reduce((a,b)=>a+(Number(b.amount)||0),0);
            const fijos = m.filter(x=>x.type==='gasto' && (x.category===catList[3] || x.category===catList[4])).reduce((a,b)=>a+(Number(b.amount)||0),0);
            const bal = inC - outC; const target = inC * 0.2; const pct = target>0 ? Math.min(Math.round((bal/target)*100),100) : (bal>0?100:0);
            
            const quotesList = Array.isArray(t('quotes')) ? t('quotes') : ["Planea tus compras."]; 
            const [quoteIdx, setQuoteIdx] = useState(Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24)) % quotesList.length);
            const nextQuote = () => setQuoteIdx((prev) => (prev + 1) % quotesList.length);

            const safeCurrencies = Array.isArray(settings.currencies) ? settings.currencies : [];
            const hasMultipleCurrencies = safeCurrencies.filter(curr => curr && curr.trim() !== '').length > 1;

            return (

                    {isVip && expire && <div className="bg-warning/10 border border-warning/30 rounded-xl p-3 flex justify-between items-center text-xs"><span className="text-warning font-bold flex items-center gap-2"><Icons.Crown c="w-4 h-4"/> Suscripción Activa</span><span className="text-secondary">Vence: {expire === '2099-12-31' ? 'Vitalicio' : expire}</span></div>}
                    
                    <CurrencyTabs currencies={safeCurrencies} activeCurrency={cur} setActiveCurrency={setActiveCurrency} c={c} />

                    <div className="bg-gradient-to-br from-card to-background rounded-3xl p-6 border shadow-lg relative overflow-hidden" style={{borderColor: c.border}}>
                        <div className="absolute top-0 right-0 p-4 opacity-10 w-28 h-28 text-accent"><Icons.Logo/></div>
                        <p className="text-secondary text-sm font-bold tracking-wider uppercase mb-1">{t('balance')||'Saldo'} ({cur})</p>
                        <p className="text-4xl font-extrabold text-white mb-6">{formatMoneda(bal, cur)}</p>
                        <div className="flex gap-4">
                            <div className="flex-1 bg-success/10 border border-success/20 rounded-2xl p-3"><p className="text-[10px] text-success font-bold uppercase flex items-center gap-1"><Icons.TrendingUp c="w-3 h-3"/> {t('income')||'Ingresos'}</p><p className="text-success font-bold text-lg mt-1">+{formatMoneda(inC, cur)}</p></div>
                            <div className="flex-1 bg-error/10 border border-error/20 rounded-2xl p-3"><p className="text-[10px] text-error font-bold uppercase flex items-center gap-1"><Icons.TrendingDown c="w-3 h-3"/> {t('exp')||'Gastos'}</p><p className="text-error font-bold text-lg mt-1">-{formatMoneda(outC, cur)}</p></div>
                        </div>
                    </div>

                    <div className="bg-card rounded-3xl p-5 border shadow-md" style={{borderColor: c.border}}>
                        <div className="flex justify-between items-center mb-3"><p className="font-bold text-primary text-sm flex items-center gap-1.5"><Icons.PiggyBank c="w-4 h-4 text-accent"/> {t('save')||'Ahorro'}</p><p className="font-bold text-accent text-sm">{pct}%</p></div>
                        <div className="w-full bg-background rounded-full h-3 mb-2"><div className="bg-accent h-3 rounded-full transition-all duration-1000" style={{width:`${pct}%`, backgroundColor: c.accent}}></div></div>
                        <div className="flex justify-between text-[11px] font-bold text-secondary"><p>{t('lbl_actual')||'Actual'}: {formatMoneda(bal, cur)}</p><p>{t('lbl_goal')||'Meta'} (20%): {formatMoneda(target, cur)}</p></div>
                    </div>

                    <div className="bg-card rounded-2xl p-5 shadow-sm border flex justify-between items-center" style={{borderColor: c.border}}>
                        <div>
                            <div className="flex items-center gap-2 mb-1"><Icons.Calendar c="w-4 h-4 text-warning"/><p className="text-sm font-bold text-primary">{t('fixed')||'Fijos'}</p></div>
                            <p className="text-xs text-secondary">{t('fixed_sub')||'Recurrentes'}</p>
                        </div>
                        <p className="text-xl font-bold text-warning">{formatMoneda(fijos, cur)}</p>
                    </div>

                    <div className="bg-background border rounded-xl p-4 flex items-start gap-3 shadow-inner relative group" style={{borderColor: c.border}}>
                        <div className="bg-accent/20 p-2 rounded-lg text-accent shrink-0"><Icons.Lightbulb c="w-5 h-5"/></div>
                        <p className="text-sm text-primary italic leading-snug flex-1">"{quotesList[quoteIdx]}"</p>
                        <button onClick={nextQuote} className="text-secondary hover:text-accent p-1.5 rounded-lg border border-transparent hover:border-border transition-colors"><Icons.RefreshCw c="w-4 h-4"/></button>
                    </div>
                </div>
            );
        }

        // --- PANTALLA 2: REGISTRO UNIFICADO ---
        function RegistroUnificado({ addTxn, cur, settings, t, isVip, user, onOpenSettings, onOpenCountryMenu, onUpgrade, formatMoneda, Icons, c }) {
            const catList = Array.isArray(t('categories')) ? t('categories') : ["Salario", "Comida", "Transporte", "Servicios", "Vivienda", "Salud", "Educación", "Entretenimiento", "Inversión", "Otros"];
            const [tipo, setTipo] = useState('gasto'); const [monto, setMonto] = useState(''); const [cat, setCat] = useState(catList[0]); const [desc, setDesc] = useState('');
            const [iaMode, setIaMode] = useState('texto'); const [iaMsg, setIaMsg] = useState(''); const [escuchando, setEscuchando] = useState(false);
            const recRef = useRef(null);

            useEffect(() => {
                if(!catList.includes(cat)) setCat(catList[0]);
            }, [settings.lang]);

            const guardarManual = (e) => {
                e.preventDefault(); if(!monto || isNaN(monto) || monto<=0) return;
                addTxn({ id: Date.now(), type: tipo, amount: parseFloat(monto), category: cat, description: desc||cat, date: new Date().toISOString(), currency: cur });
                setMonto(''); setDesc(''); alert("✅ Registrado.");
            };

            const toggleVoz = () => {
                if(escuchando) { recRef.current?.stop(); setEscuchando(false); return; }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if(!SR) return alert("Navegador no soporta voz.");
                const rec = new SR(); 
                rec.lang = settings.lang === 'en' ? 'en-US' : settings.lang === 'pt' ? 'pt-BR' : 'es-ES';
                rec.interimResults = true;
                rec.onresult = (e) => { let txt=""; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript; setIaMsg(txt); };
                rec.onerror = () => setEscuchando(false); rec.onend = () => setEscuchando(false);
                recRef.current = rec; rec.start(); setEscuchando(true);
            };

            const procesarIA = () => {
                if(!iaMsg) return; const txt = iaMsg.toLowerCase();
                const incomeKeywords = Array.isArray(t('income_words')) ? t('income_words') : ["recib", "ingreso", "gan", "cobr"];
                const isInc = incomeKeywords.some(w => txt.includes(w));
                const type = isInc ? 'ingreso' : 'gasto';
                const nums = txt.match(/\d+(\.\d+)?/); const amount = nums ? parseFloat(nums[0]) : 0;
                if(amount > 0) {
                    let cItem = catList[catList.length - 1]; // "Otros"
                    catList.forEach(x => { if(txt.includes(x.toLowerCase())) cItem = x; });
                    addTxn({ id: Date.now(), type, amount, category: cItem, description: iaMsg, date: new Date().toISOString(), currency: cur });
                    setIaMsg(''); setIaMode('texto'); alert(`🤖 IA: ${type.toUpperCase()} - ${formatMoneda(amount, cur)} (${cItem})`);
                } else alert(t('msg_no_amount') || "No detecté monto.");
            };

            const safeCurrencies = Array.isArray(settings.currencies) ? settings.currencies : [];
            const hasMultipleCurrencies = safeCurrencies.filter(curr => curr && curr.trim() !== '').length > 1;

            return (
                <div className={`p-4 space-y-6 view-animate ${hasMultipleCurrencies ? 'pt-20' : ''}`}>
                    <TopHeader title={t('record')||'Registrar'} user={user} isVip={isVip} onOpenSettings={onOpenSettings} country={settings.country} onOpenCountryMenu={onOpenCountryMenu} c={c} />
                    
                    <div className="bg-card rounded-3xl p-5 border shadow-lg" style={{borderColor: c.border}}>
                        <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><Icons.Plus c="w-5 h-5 text-accent"/> {t('manual')||'Manual'}</h2>
                        <form onSubmit={guardarManual} className="space-y-4">
                            <div className="flex bg-background rounded-xl p-1 border" style={{borderColor: c.border}}>
                                <button type="button" onClick={()=>setTipo('gasto')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${tipo==='gasto'?'bg-error text-white':'text-secondary'}`}>{t('btn_expense')||'Gasto'}</button>
                                <button type="button" onClick={()=>setTipo('ingreso')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${tipo==='ingreso'?'bg-success text-white':'text-secondary'}`}>{t('btn_income')||'Ingreso'}</button>
                            </div>
                            <input type="number" step="0.01" value={monto} onChange={e=>setMonto(e.target.value)} required className="w-full p-4 rounded-xl border bg-background outline-none text-2xl font-bold text-primary text-center" style={{borderColor: c.border}} placeholder="0.00"/>
                            <div className="flex gap-2">
                                <select value={cat || catList[0]} onChange={e=>setCat(e.target.value)} className="w-1/2 p-3 rounded-xl border bg-background outline-none text-sm text-primary font-bold" style={{borderColor: c.border}}>{catList.map(cItem=><option key={cItem} value={cItem}>{cItem}</option>)}</select>
                                <input type="text" value={desc} onChange={e=>setDesc(e.target.value)} className="w-1/2 p-3 rounded-xl border bg-background outline-none text-sm text-primary" style={{borderColor: c.border}} placeholder={t('desc')||'Descripción'}/>
                            </div>
                            <button type="submit" className="w-full py-3.5 bg-accent text-white rounded-xl font-bold shadow-lg shadow-accent/30" style={{backgroundColor: c.accent}}>{t('btn_save')||'Guardar'}</button>
                        </form>
                    </div>

                    <div className="relative bg-card rounded-3xl p-5 border shadow-lg overflow-hidden" style={{borderColor: c.border}}>
                        <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-warning"><Icons.Brain c="w-5 h-5"/> {t('ai')||'IA'}</h2>
                        
                        {!isVip && (
                            <div className="absolute inset-0 z-10 glass-panel flex flex-col items-center justify-center text-center p-6">
                                <div className="w-12 h-12 bg-warning/20 text-warning rounded-full flex items-center justify-center mb-3"><Icons.Crown c="w-6 h-6"/></div>
                                <h3 className="font-bold text-white mb-2">Desbloquea la Inteligencia Artificial</h3>
                                <button onClick={onUpgrade} className="bg-warning text-black font-bold px-6 py-2.5 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.4)] hover:scale-105 transition">{t('btn_see_plans')||'Ver Planes'}</button>
                            </div>
                        )}

                        <div className={!isVip ? "opacity-30 pointer-events-none filter blur-sm" : ""}>
                            <div className="flex bg-background rounded-xl p-1 mb-4 border" style={{borderColor: c.border}}>
                                <button onClick={()=>{setIaMode('texto'); if(escuchando) toggleVoz();}} className={`flex-1 py-2 rounded-lg font-bold text-sm ${iaMode==='texto'?'bg-card text-primary shadow-sm':'text-secondary'}`}>{t('btn_write')||'Texto'}</button>
                                <button onClick={()=>setIaMode('voz')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${iaMode==='voz'?'bg-card text-primary shadow-sm':'text-secondary'}`}>{t('btn_speak')||'Voz'}</button>
                            </div>
                            
                            {iaMode === 'texto' ? (
                                <div>
                                    <textarea value={iaMsg} onChange={e=>setIaMsg(e.target.value)} className="w-full p-4 border rounded-xl mb-3 bg-background outline-none text-sm text-primary font-medium" style={{borderColor: c.border}} rows="3"></textarea>
                                    <button onClick={procesarIA} className="w-full py-3 bg-[#19191c] border border-warning/50 text-warning rounded-xl font-bold shadow-sm">{t('btn_process_ai')||'Analizar'}</button>
                                </div>
                            ) : (
                                <div className="flex flex-col items-center py-4">
                                    <button onClick={toggleVoz} className={`w-20 h-20 rounded-full flex items-center justify-center border-2 transition-all duration-300 shadow-lg ${escuchando ? 'bg-error/20 border-error text-error scale-110' : 'bg-background border-warning text-warning'}`} style={escuchando ? {} : {borderColor: 'var(--col-warning)', color: 'var(--col-warning)'}}>
                                        {escuchando ? <Icons.MicOff c="w-8 h-8"/> : <Icons.Mic c="w-8 h-8"/>}
                                    </button>
                                    <p className="text-xs text-secondary mt-4 mb-2">{escuchando ? (t('msg_listening')||'Escuchando...') : (t('msg_tap_mic')||'Toca para hablar')}</p>
                                    {iaMsg && <div className="w-full mt-2"><div className="p-4 bg-background rounded-xl border text-sm font-medium text-primary mb-3 italic shadow-inner" style={{borderColor: c.border}}>"{iaMsg}"</div>{!escuchando && <button onClick={procesarIA} className="w-full py-3 bg-warning text-black rounded-xl font-bold shadow-lg">{t('btn_analyze_txt')||'Analizar Texto'}</button>}</div>}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- PANTALLA 3: ANÁLISIS IA (DINÁMICO) ---
        function Analisis({ txns, cur, settings, t, isVip, user, onOpenSettings, onOpenCountryMenu, onUpgrade, formatMoneda, Icons, c }) {
            const safeCurrencies = Array.isArray(settings.currencies) ? settings.currencies : [];
            const hasMultipleCurrencies = safeCurrencies.filter(curr => curr && curr.trim() !== '').length > 1;

            if (!isVip) {
                return (
                    <div className={`p-4 view-animate h-screen flex flex-col ${hasMultipleCurrencies ? 'pt-20' : ''}`}>
                        <TopHeader title={t('analysis')||'Análisis'} user={user} isVip={isVip} onOpenSettings={onOpenSettings} country={settings.country} onOpenCountryMenu={onOpenCountryMenu} c={c} />
                        <div className="flex-1 flex flex-col items-center justify-center text-center pb-20">
                            <div className="w-20 h-20 rounded-full bg-warning/10 text-warning flex items-center justify-center mb-6 shadow-lg border border-warning/20"><Icons.Crown c="w-10 h-10" /></div>
                            <h2 className="text-2xl font-bold text-primary mb-3">Evaluación Semanal VIP</h2>
                            <button onClick={onUpgrade} className="bg-warning text-black text-sm uppercase font-bold px-6 py-3 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.4)] hover:scale-105 transition-transform">{t('btn_see_plans')||'Ver Planes'}</button>
                        </div>
                    </div>
                );
            }

            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [tipsGen, setTipsGen] = useState([]);

            const safeTxns = Array.isArray(txns) ? txns : [];
            const currentTxnsAll = safeTxns.filter(txn => txn && txn.currency === cur);
            const today = new Date(); const sevenDaysAgo = new Date(today.getTime() - (7 * 24 * 60 * 60 * 1000));
            const weeklyTxns = currentTxnsAll.filter(txn => txn.date && new Date(txn.date) >= sevenDaysAgo);
            
            const ingresos = weeklyTxns.filter(txn => txn.type === 'ingreso').reduce((a, b) => a + (Number(b.amount)||0), 0);
            const gastos = weeklyTxns.filter(txn => txn.type === 'gasto').reduce((a, b) => a + (Number(b.amount)||0), 0);
            const balance = ingresos - gastos;

            const gastosPorCat = weeklyTxns.filter(t => t.type === 'gasto').reduce((acc, t) => {
                acc[t.category] = (acc[t.category] || 0) + (Number(t.amount)||0); return acc;
            }, {});
            const topGasto = Object.entries(gastosPorCat).sort((a,b) => b[1] - a[1])[0];

            const handleAnalyze = () => {
                setIsAnalyzing(true);
                setTimeout(() => {
                    setIsAnalyzing(false);
                    const newTips = [];
                    if (ingresos > 0) newTips.push(`${t('analisis_sv_1')||'Ahorraste'} ${Math.max(0, Math.round((balance/ingresos)*100))}${t('analisis_sv_2')||'%'}`);
                    if (topGasto) newTips.push(`${t('analisis_leak_1')||'Fuga en'} ${topGasto[0]} (${formatMoneda(topGasto[1], cur)})${t('analisis_leak_2')||'.'}`);
                    if (gastos > ingresos) newTips.push(t('analisis_warn')||'Gastos superan ingresos.');
                    
                    const randomExtras = Array.isArray(t('tips')) ? t('tips') : ["Planifica tus finanzas."];
                    if (randomExtras.length > 0) newTips.push(randomExtras[Math.floor(Math.random() * randomExtras.length)]);
                    
                    if (gastos === 0 && ingresos === 0) setTipsGen([t('analisis_none')||'Sin datos recientes.']);
                    else setTipsGen(newTips);
                }, 1500);
            };

            useEffect(() => { handleAnalyze(); }, []);

            return (
                <div className={`p-4 space-y-4 view-animate ${hasMultipleCurrencies ? 'pt-20' : ''}`}>
                    <TopHeader title={t('analysis')||'Análisis'} user={user} isVip={isVip} onOpenSettings={onOpenSettings} country={settings.country} onOpenCountryMenu={onOpenCountryMenu} c={c} />
                    
                    <p className="text-secondary text-sm font-bold uppercase tracking-widest mt-1 mb-6 text-center">{t('last_7')||'Últimos 7 días'}</p>
                    
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-card rounded-3xl p-5 border shadow-md" style={{borderColor: c.border}}><p className="text-[10px] uppercase font-bold text-secondary mb-1">{t('income')||'Ingresos'}</p><p className="text-xl font-extrabold text-success">{formatMoneda(ingresos, cur)}</p></div>
                        <div className="bg-card rounded-3xl p-5 border shadow-md" style={{borderColor: c.border}}><p className="text-[10px] uppercase font-bold text-secondary mb-1">{t('exp')||'Gastos'}</p><p className="text-xl font-extrabold text-error">{formatMoneda(gastos, cur)}</p></div>
                    </div>

                    <div className={`rounded-3xl p-6 text-center shadow-lg border ${balance >= 0 ? 'bg-success/10 border-success/30' : 'bg-error/10 border-error/30'}`}>
                        <p className="text-secondary text-xs font-bold uppercase tracking-widest mb-2">{t('weekly_balance')||'Balance'}</p>
                        <p className={`text-4xl font-extrabold ${balance >= 0 ? 'text-success' : 'text-error'}`}>{balance >= 0 ? '+' : ''}{formatMoneda(balance, cur)}</p>
                    </div>

                    <div className="bg-card rounded-3xl p-6 border shadow-lg mt-6 relative overflow-hidden" style={{borderColor: c.border}}>
                        <div className="flex justify-between items-center mb-5">

        // --- PANTALLA 4: HISTORIAL (SEGURA Y FORTIFICADA) ---
        function Historial({ txns, cur, setCur, curList, deleteTxn, updateTxn, t, isVip, user, onOpenSettings, onOpenCountryMenu, settings, formatMoneda, Icons, c }) {
            const safeTxns = Array.isArray(txns) ? txns : [];
            const currentTxnsAll = safeTxns.filter(txn => txn && txn.currency === cur);
            
            const [filtro, setFiltro] = useState('Semanal'); 
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedDay, setSelectedDay] = useState(null);
            const [editingTxn, setEditingTxn] = useState(null);

            const year = currentDate.getFullYear(); const month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate(); const firstDay = new Date(year, month, 1).getDay();

            const changeMonth = (dir) => { setCurrentDate(new Date(year, month + dir, 1)); setSelectedDay(null); };
            const checkDayHasTxns = (d) => { 
                const dateStr = new Date(year, month, d).toISOString().split('T')[0]; 
                return currentTxnsAll.some(txn => txn.date && txn.date.startsWith(dateStr)); 
            };

            let displayTxns = [...currentTxnsAll].reverse(); let label = "";
            if (filtro === 'Diario' && selectedDay) {
                const dateStr = new Date(year, month, selectedDay).toISOString().split('T')[0];
                displayTxns = displayTxns.filter(txn => txn.date && txn.date.startsWith(dateStr));
                label = `${selectedDay} DE ${MESES[month].toUpperCase()} ${year}`;
            } else if (filtro === 'Semanal') {
                displayTxns = displayTxns.filter(txn => txn.date && new Date(txn.date).getMonth() === month);
                label = `SEM · ${MESES[month].substring(0,3).toUpperCase()}. ${year}`;
            } else {
                displayTxns = displayTxns.filter(txn => txn.date && new Date(txn.date).getMonth() === month);
                label = `${MESES[month].toUpperCase()} ${year}`;
            }

            const inTotal = displayTxns.filter(txn => txn.type === 'ingreso').reduce((a, b) => a + (Number(b.amount)||0), 0);
            const outTotal = displayTxns.filter(txn => txn.type === 'gasto').reduce((a, b) => a + (Number(b.amount)||0), 0);

            const EditModal = ({ txn, onClose }) => {
                const catList = Array.isArray(t('categories')) ? t('categories') : ["Salario", "Comida", "Transporte", "Servicios", "Vivienda", "Salud", "Educación", "Entretenimiento", "Inversión", "Otros"];
                const [monto, setMonto] = useState(txn.amount || ''); const [cat, setCat] = useState(txn.category || catList[0]); const [desc, setDesc] = useState(txn.description || '');
                const handleSave = (e) => { e.preventDefault(); updateTxn({ ...txn, amount: parseFloat(monto)||0, category: cat, description: desc }); onClose(); };
                return (
                    <div className="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4">
                        <div className="bg-card w-full max-w-sm rounded-3xl p-6 border shadow-2xl view-animate relative" style={{borderColor: c.border}}>
                            <button onClick={onClose} className="absolute top-4 right-4 bg-background border rounded-full p-1.5 text-secondary hover:text-white transition z-10" style={{borderColor: c.border}}><Icons.X c="w-5 h-5"/></button>
                            <h2 className="text-xl font-bold mb-6 text-primary flex items-center gap-2"><Icons.Pencil c="w-5 h-5 text-accent"/> Editar</h2>
                            <form onSubmit={handleSave} className="space-y-4">
                                <input type="number" step="0.01" value={monto} onChange={e=>setMonto(e.target.value)} className="w-full p-4 rounded-xl border bg-background outline-none text-primary font-bold text-2xl text-center" style={{borderColor: c.border}}/>
                                <select value={cat} onChange={e=>setCat(e.target.value)} className="w-full p-3.5 rounded-xl border bg-background outline-none text-primary text-sm font-bold" style={{borderColor: c.border}}>{catList.map(catItem => <option key={catItem} value={catItem}>{catItem}</option>)}</select>
                                <input type="text" value={desc} onChange={e=>setDesc(e.target.value)} className="w-full p-3.5 rounded-xl border bg-background outline-none text-primary text-sm" style={{borderColor: c.border}}/>
                                <button type="submit" className="w-full py-4 bg-accent text-white rounded-xl font-bold text-sm shadow-lg shadow-accent/30 mt-4" style={{backgroundColor: c.accent}}>{t('btn_save')||'Guardar'}</button>
                            </form>
                        </div>
                    </div>
                );
            };

            const safeCurList = Array.isArray(curList) ? curList : [];
            const hasMultipleCurrencies = safeCurList.filter(curr => curr && curr.trim() !== '').length > 1;
            const daysArr = Array.isArray(t('days')) ? t('days') : ["D","L","M","M","J","V","S"];

            return (
                <div className={`p-4 space-y-4 view-animate ${hasMultipleCurrencies ? 'pt-20' : ''}`}>
                    <TopHeader title={t('history')||'Historial'} user={user} isVip={isVip} onOpenSettings={onOpenSettings} country={settings.country} onOpenCountryMenu={onOpenCountryMenu} c={c} />
                    
                    <CurrencyTabs currencies={safeCurList} activeCurrency={cur} setActiveCurrency={setCur} c={c} />

                    <div className="bg-card rounded-3xl p-5 border shadow-md" style={{borderColor: c.border}}>
                        <div className="flex justify-between items-center mb-4">
                            <button onClick={() => changeMonth(-1)} className="text-secondary hover:text-primary p-2 bg-background border rounded-full" style={{borderColor: c.border}}><Icons.ChevronLeft c="w-4 h-4"/></button>
                            <span className="font-bold text-primary tracking-wide">{MESES[month]} {year}</span>
                            <button onClick={() => changeMonth(1)} className="text-secondary hover:text-primary p-2 bg-background border rounded-full" style={{borderColor: c.border}}><Icons.ChevronRight c="w-4 h-4"/></button>
                        </div>
                        <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-secondary mb-2 uppercase">
                            {daysArr.map((d, i) => <span key={i}>{d}</span>)}
                        </div>
                        <div className="grid grid-cols-7 gap-y-2 gap-x-1 text-center text-sm font-medium">
                            {Array.from({length: firstDay}).map((_, i) => <div key={`blank-${i}`}></div>)}
                            {Array.from({length: daysInMonth}).map((_, i) => {
                                const d = i + 1; const hasDot = checkDayHasTxns(d); const isSelected = selectedDay === d;
                                return (
                                    <div key={d} onClick={() => { setSelectedDay(d); setFiltro('Diario'); }} className="relative flex justify-center cursor-pointer group py-1">
                                        <div className={`w-8 h-8 flex items-center justify-center rounded-full transition-all duration-300 ${isSelected ? 'text-white font-bold shadow-lg scale-110' : 'text-secondary group-hover:bg-border group-hover:text-white'}`} style={isSelected ? {backgroundColor: c.accent} : {}}>{d}</div>
                                        {hasDot && <span className={`absolute bottom-0 w-1.5 h-1.5 rounded-full`} style={isSelected ? {backgroundColor: 'white'} : {backgroundColor: c.accent}}></span>}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="flex bg-card rounded-xl border p-1 shadow-sm" style={{borderColor: c.border}}>
                        {[t('tab_daily')||'Diario', t('tab_weekly')||'Semanal', t('tab_monthly')||'Mensual'].map((f, idx) => {
                            const rawFilter = ['Diario', 'Semanal', 'Mensual'][idx];
                            return <button key={rawFilter} onClick={() => { setFiltro(rawFilter); if(rawFilter!=='Diario') setSelectedDay(null); }} className={`flex-1 py-2.5 text-xs rounded-lg font-bold transition-all duration-300 ${filtro === rawFilter ? 'bg-background text-primary shadow-sm border' : 'text-secondary hover:text-primary'}`} style={filtro === rawFilter ? {borderColor: c.border} : {}}>{f}</button>
                        })}
                    </div>

                    <div className="flex justify-between items-center text-[10px] font-bold text-secondary uppercase tracking-widest mt-6 mb-2 bg-background p-2.5 rounded-lg border" style={{borderColor: c.border}}>
                        <span>{label}</span>
                        <div className="flex gap-4"><span className="text-success">+{formatMoneda(inTotal, cur)}</span><span className="text-error">-{formatMoneda(outTotal, cur)}</span></div>
                    </div>

                    <div className="space-y-3">
                        {displayTxns.length === 0 ? <p className="text-center text-secondary py-10 text-sm font-medium">{t('no_txns')||'Sin datos'}</p> : 
                        displayTxns.map(txn => {
                            let puedeEditar = false;
                            if (txn.date) {
                                const txnDate = new Date(txn.date);
                                if (!isNaN(txnDate.getTime())) {
                                    const tiempoTranscurrido = new Date() - txnDate;
                                    puedeEditar = tiempoTranscurrido <= 86400000;
                                }
                            }
                            
                            const validDate = txn.date && !isNaN(new Date(txn.date).getTime()) ? new Date(txn.date).toLocaleDateString() : '';

                            return (
                                <div key={txn.id} className="flex justify-between items-center p-4 bg-card rounded-3xl border shadow-sm group hover:border-accent transition-colors duration-300" style={{borderColor: c.border}}>
                                    <div className="flex items-center gap-4">
                                        <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 ${txn.type === 'ingreso' ? 'bg-success/10 text-success' : 'bg-error/10 text-error'}`}>
                                            {txn.type === 'ingreso' ? <Icons.TrendingUp c="w-6 h-6"/> : <Icons.TrendingDown c="w-6 h-6"/>}
                                        </div>
                                        <div>
                                            <p className="font-bold text-sm text-primary mb-0.5">{txn.description}</p>
                                            <p className="text-[10px] text-secondary font-medium uppercase tracking-wider">{txn.category} • {validDate}</p>
                                        </div>
                                    </div>
                                    <div className="flex flex-col items-end gap-2">
                                        <span className={`font-bold text-sm ${txn.type==='ingreso'?'text-success':'text-error'}`}>
                                            {txn.type==='ingreso'?'+':'-'}{formatMoneda(txn.amount||0, cur)}
                                        </span>
                                        <div className="flex items-center gap-1.5 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                                            {puedeEditar ? (
                                                <button onClick={()=>setEditingTxn(txn)} className="p-1.5 text-secondary hover:text-accent bg-background rounded-lg border shadow-sm" style={{borderColor: c.border}}><Icons.Pencil c="w-3.5 h-3.5"/></button>
                                            ) : (
                                                <span className="p-1.5 text-secondary/30 bg-background rounded-lg border border-transparent" title="Protegido (Pasaron 24h)"><Icons.Shield c="w-3.5 h-3.5"/></span>
                                            )}
                                            <button onClick={()=>deleteTxn(txn.id)} className="p-1.5 text-secondary hover:text-error bg-background rounded-lg border shadow-sm" style={{borderColor: c.border}}><Icons.Trash c="w-3.5 h-3.5"/></button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {editingTxn && <EditModal txn={editingTxn} onClose={()=>setEditingTxn(null)} />}
                </div>
            );
        }

        // --- PANTALLA 5: AJUSTES (MODAL FLOTANTE VIP) ---
        function AjustesModal({ onClose, onPreview, settings, saveSettings, user, isVip, onLogout, onUpgrade, Icons, c }) {
            const [local, setLocal] = useState(settings);
            const [code, setCode] = useState(''); const [crm, setCrm] = useState(false);
            const [customTab, setCustomTab] = useState('temas');
            const prof = DB.getUserData(user)?.profile;

            useEffect(() => {
                if (isVip && onPreview) onPreview(local);
            }, [local]);

            const chgCountry = (e) => {
                const cName = e.target.value; const cData = COUNTRIES.find(x => x.name === cName);
                if(cData) { const nc = [...local.currencies]; nc[0] = cData.defaultCurr; setLocal({...local, country: cName, lang: cData.lang, currencies: nc}); }
            };

            const backup = async () => {
                const p = prompt("Crea una clave para encriptar tu respaldo:"); if(!p) return;
                const ud = DB.getUserData(user);
                const payload = { txns: DB.getTxns(user), settings: local, vip: ud.vip, expireAt: ud.expireAt };
                const d = CryptoJS.AES.encrypt(JSON.stringify(payload), p).toString();
                try {
                    await navigator.clipboard.writeText(d);
                    window.open(`https://wa.me/?text=${encodeURIComponent("Mi código seguro Billetera:\n" + d)}`);
                } catch(e) { alert("Copia este código manualmente:\n\n" + d); }
            };

            const restore = () => {
                if(!code) return alert("Pega el código."); const p = prompt("Clave de cifrado:"); if(!p) return;
                try {
                    const dec = CryptoJS.AES.decrypt(code, p).toString(CryptoJS.enc.Utf8);
                    if(dec && confirm("⚠️ ¿Sobrescribir datos y restaurar tu cuenta?")) { 
                        const data = JSON.parse(dec);
                        if (Array.isArray(data)) { DB.saveTxns(user, data); } else {
                            if(data.txns) DB.saveTxns(user, data.txns);
                            if(data.settings) DB.saveSettings(user, data.settings);
                            if(data.vip && data.expireAt) DB.activateVip(user, data.expireAt);
                        }
                        alert("✅ Restauración completada exitosamente."); window.location.reload(); 
                    }
                } catch(e) { alert("❌ Error: Clave incorrecta o código dañado."); }
            };

            const redeem = () => {
                const c = prompt("Ingresa el código VIP:"); if(!c) return; const cl = c.trim().toUpperCase();
                if(cl === 'SIRQCHO-ADMIN') return setCrm(true);
                if(!cl.includes('-')) return alert("Código inválido.");
                const [dStr, hash] = cl.split('-');
                if(hash === CryptoJS.SHA256(user.toLowerCase().trim() + dStr + "Billetera_Carlos_Secreta_195").toString().substring(0,6).toUpperCase()) {
                    const fDate = `${dStr.substring(0,4)}-${dStr.substring(4,6)}-${dStr.substring(6,8)}`;
                    if(fDate < new Date().toISOString().split('T')[0]) return alert("El código caducó.");
                    DB.activateVip(user, fDate); alert("VIP Activado!"); window.location.reload();
                } else alert("Código inválido para este correo.");
            };

            return (
                <div className="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-[200]">
                    <div className="bg-card w-full max-w-lg rounded-3xl p-6 border shadow-2xl relative max-h-[90vh] overflow-y-auto flex flex-col view-animate" style={{borderColor: c.border}}>
                        <button onClick={onClose} className="absolute top-4 right-4 bg-background border rounded-full p-1.5 text-secondary hover:text-white transition z-10 shadow-md" style={{borderColor: c.border}}><Icons.X c="w-5 h-5"/></button>
                        
                        {crm && <AdminCRMModal onClose={()=>setCrm(false)} cur={local.currencies[0]}/>}
                        
                        <h1 className="text-2xl font-extrabold text-primary mb-6">Ajustes Globales</h1>
                        
                        <div className="bg-background p-6 rounded-3xl border shadow-inner mb-6" style={{borderColor: c.border}}>
                            <div className="flex items-center gap-4 mb-6">
                                {prof?.picture ? <img src={prof.picture} className="w-14 h-14 rounded-full border-2 shadow-md" style={{borderColor: c.border}} alt="Avatar"/> : <div className="w-14 h-14 bg-card rounded-full border flex items-center justify-center font-bold text-xl shadow-md" style={{borderColor: c.border}}>U</div>}
                                <div>
                                    <p className="font-bold text-primary text-lg leading-tight">{prof?.name||user}</p>
                                    <p className="text-xs text-secondary mb-2">{user}</p>
                                    {isVip ? <span className="bg-warning/20 text-warning px-2 py-0.5 rounded text-[10px] font-bold tracking-widest border border-warning/30">USUARIO VIP</span> : <span className="bg-accent/20 text-accent px-2 py-0.5 rounded text-[10px] font-bold tracking-widest border border-accent/30" style={{color: c.accent, borderColor: `${c.accent}4D`}}>USUARIO FREE</span>}
                                </div>
                            </div>
                            
                            <button onClick={redeem} className={`w-full bg-warning/10 text-warning border border-warning/30 p-3.5 rounded-xl font-bold text-sm mb-3 shadow-sm hover:bg-warning hover:text-black transition ${isVip ? 'opacity-80' : ''}`}>
                                👑 {isVip ? 'Renovar / Ingresar Nuevo Código VIP' : 'Canjear Código VIP'}
                            </button>
                            
                            <button onClick={onLogout} className="w-full bg-card border border-error/50 text-error p-3.5 rounded-xl font-bold text-sm hover:bg-error hover:text-white transition flex items-center justify-center gap-2 shadow-sm" style={{borderColor: '#ef444480'}}><Icons.LogOut c="w-4 h-4"/> Cerrar Sesión</button>
                        </div>

                        <div className="space-y-6">
                            <div className="grid grid-cols-1 gap-4">
                                <div>
                                    <label className="text-[10px] font-bold text-secondary uppercase mb-2 block tracking-widest">País de Residencia y Monedas</label>
                                    <select value={local.country} onChange={chgCountry} className="w-full p-3 rounded-xl border bg-background outline-none text-primary text-sm font-bold shadow-inner mb-3" style={{borderColor: c.border}}>

                                <div className="flex justify-between items-center mb-4">
                                    <label className="text-[10px] font-bold text-secondary uppercase tracking-widest flex items-center gap-1.5"><Icons.Palette c="w-3 h-3"/> Personalización VIP</label>
                                    <button onClick={()=>{setLocal({...local, colors: DEFAULT_SETTINGS.colors, themeName: DEFAULT_SETTINGS.themeName, fontFamily: DEFAULT_SETTINGS.fontFamily});}} className="text-[10px] text-accent font-bold hover:underline flex items-center gap-1"><Icons.RefreshCw c="w-3 h-3"/> Restaurar Default</button>
                                </div>

                                <div className="flex bg-background rounded-xl p-1 mb-4 border shadow-inner" style={{backgroundColor: c.navBg, borderColor: c.border}}>
                                    <button onClick={()=>setCustomTab('temas')} className={`flex-1 py-2 rounded-lg font-bold text-xs transition-all duration-300 ${customTab==='temas'?'bg-card text-primary shadow border':'text-secondary hover:text-primary'}`} style={customTab==='temas'?{borderColor: c.border}:{}}>🎨 1. Temas</button>

                                    <button onClick={()=>setCustomTab('textos')} className={`flex-1 py-2 rounded-lg font-bold text-xs transition-all duration-300 ${customTab==='textos'?'bg-card text-primary shadow border':'text-secondary hover:text-primary'}`} style={customTab==='textos'?{borderColor: c.border}:{}}>Aa 3. Textos</button>
                                </div>

                                <div className="bg-card rounded-xl p-4 shadow-sm min-h-[220px]" style={{borderColor: c.border}}>
                                    {customTab === 'temas' && (
                                        <div>
                                            <p className="text-[10px] text-secondary mb-3 text-center">12 Personalidades diseñadas para ti</p>

                                                </div>
                                                <div className="flex flex-col items-center gap-2">
                                                    <input type="color" value={local.colors.card} onChange={e=>setLocal({...local, colors:{...local.colors, card:e.target.value}})} className="w-16 h-16 rounded-xl cursor-pointer border-2 shadow-sm" style={{borderColor: c.border}}/>

                                        <div>
                                            <p className="text-[10px] text-secondary mb-4 text-center">Elige tu tipografía favorita de 12 estilos</p>
                                            <select value={local.fontFamily} onChange={e=>setLocal({...local, fontFamily: e.target.value})} className="w-full p-3 rounded-xl border bg-background outline-none text-primary text-sm font-bold shadow-inner mb-4" style={{fontFamily: local.fontFamily, borderColor: c.border}}>
                                                {PREDEFINED_FONTS.map(f => <option key={f.name} value={f.value} style={{fontFamily: f.value}}>{f.name}</option>)}
                                            </select>
                                            <div className="flex justify-center items-center gap-4">
                                                <span className="text-[10px] font-bold uppercase text-secondary">Color de texto principal:</span>
                                                <input type="color" value={local.colors.text} onChange={e=>setLocal({...local, colors:{...local.colors, text:e.target.value}})} className="w-10 h-10 rounded-lg cursor-pointer border shadow-sm" style={{borderColor: c.border}}/>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="pt-4 border-t" style={{borderColor: c.border}}>
                                <label className="text-[10px] font-bold text-success uppercase mb-3 flex items-center gap-1.5 tracking-widest"><Icons.Shield c="w-4 h-4"/> Respaldo Cifrado (AES-256)</label>
                                <button onClick={backup} className="w-full bg-success/10 text-success border border-success/30 p-3.5 rounded-xl font-bold text-sm mb-4 shadow-sm hover:bg-success hover:text-white transition">↑ Enviar a WhatsApp</button>
                                <div className="bg-background p-2 rounded-xl border flex items-center gap-2 shadow-inner" style={{borderColor: c.border}}>
                                    <input type="text" value={code} onChange={e=>setCode(e.target.value)} className="flex-1 p-2 bg-transparent outline-none text-xs text-primary font-mono" placeholder="Pega el código aquí"/>
                                    <button onClick={restore} className="bg-card border text-primary px-4 py-2 rounded-lg font-bold text-xs hover:bg-accent hover:text-white transition shadow-sm" style={{borderColor: c.border}}>↓ Restaurar</button>
                                </div>
                            </div>

                            <button onClick={()=>{saveSettings(local); onClose();}} className="w-full bg-accent text-white p-4 rounded-xl font-bold mt-2 shadow-lg shadow-accent/30 text-lg hover:scale-[1.02] transition-transform">Guardar y Cerrar</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- APP PRINCIPAL ---
        function App() {
            const [user, setUser] = useState(null);
            const [vip, setVip] = useState(false); const [exp, setExp] = useState(null);
            const [view, setView] = useState('home'); const [showPay, setShowPay] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showCountryModal, setShowCountryModal] = useState(false);
            const [txns, setTxns] = useState([]); const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [previewSettings, setPreviewSettings] = useState(null); 
            const [cur, setCur] = useState('PEN');

            useEffect(() => { const sUser = sessionStorage.getItem('billetera_active_user'); if(sUser) loadData(sUser); }, []);

            const loadData = (u) => {
                setUser(u); const ud = DB.getUserData(u);
                if(ud?.vip && ud.expireAt && ud.expireAt >= new Date().toISOString().split('T')[0]) { setVip(true); setExp(ud.expireAt); }
                else { DB.deactivateVip(u); setVip(false); setExp(null); }
                setTxns(Array.isArray(DB.getTxns(u)) ? DB.getTxns(u) : []); 
                const s = DB.getSettings(u); setSettings(s); setCur(s.currencies[0]||'PEN'); setView('home');
            };

            const login = (u, p) => { sessionStorage.setItem('billetera_active_user', u); DB.loginOrRegisterGoogle(u, p); loadData(u); };
            
            const handleCloseSettings = () => { setPreviewSettings(null); setShowSettings(false); };

            const handleSaveSettings = (newSettings) => {
                setSettings(newSettings); DB.saveSettings(user, newSettings); setCur(newSettings.currencies[0]);
                setPreviewSettings(null); setShowSettings(false);
            };

            const logout = () => { sessionStorage.removeItem('billetera_active_user'); setUser(null); handleCloseSettings(); };

            const activeSettings = previewSettings || settings;
            useEffect(() => {
                const root = document.documentElement; const c = activeSettings.colors;
                root.style.setProperty('--col-bg', c.bg); root.style.setProperty('--col-card', c.card);
                root.style.setProperty('--col-text', c.text); root.style.setProperty('--col-secondary', c.secondary);
                root.style.setProperty('--col-border', c.border); root.style.setProperty('--col-accent', c.accent);
                root.style.setProperty('--col-nav-bg', c.navBg); root.style.setProperty('--col-nav-active-bg', c.navActiveBg);
                root.style.setProperty('--col-nav-active-text', c.navActiveText);
                document.body.style.fontFamily = activeSettings.fontFamily;
            }, [activeSettings]);

            if(!user) return <div><AuthView onLogin={login}/></div>;

            const t = (k) => DICTIONARY[activeSettings.lang]?.[k] || DICTIONARY['es'][k];
            
            const renderV = () => {
                switch(view) {
                    case 'home': return <Dashboard txns={txns} cur={cur} setActiveCurrency={setCur} settings={activeSettings} t={t} isVip={vip} user={user} onOpenSettings={()=>setShowSettings(true)} onOpenCountryMenu={()=>setShowCountryModal(true)} expire={exp} formatMoneda={formatMoneda} Icons={Icons} c={activeSettings.colors}/>;
                    case 'nueva': return <RegistroUnificado addTxn={x=>{const nw=[...txns,x];setTxns(nw);DB.saveTxns(user,nw);}} cur={cur} settings={activeSettings} t={t} isVip={vip} user={user} onOpenSettings={()=>setShowSettings(true)} onOpenCountryMenu={()=>setShowCountryModal(true)} onUpgrade={()=>setShowPay(true)} formatMoneda={formatMoneda} Icons={Icons} c={activeSettings.colors}/>;
                    case 'analisis': return <Analisis txns={txns} cur={cur} settings={activeSettings} t={t} isVip={vip} user={user} onOpenSettings={()=>setShowSettings(true)} onOpenCountryMenu={()=>setShowCountryModal(true)} onUpgrade={()=>setShowPay(true)} formatMoneda={formatMoneda} Icons={Icons} c={activeSettings.colors}/>;
                    case 'historial': return <Historial txns={txns} cur={cur} setCur={setCur} curList={activeSettings.currencies} deleteTxn={id=>{if(confirm("¿Borrar?")){const nw=txns.filter(x=>x.id!==id);setTxns(nw);DB.saveTxns(user,nw);}}} updateTxn={x=>{const nw=txns.map(t=>t.id===x.id?x:t);setTxns(nw);DB.saveTxns(user,nw);}} t={t} isVip={vip} user={user} onOpenSettings={()=>setShowSettings(true)} onOpenCountryMenu={()=>setShowCountryModal(true)} settings={activeSettings} formatMoneda={formatMoneda} Icons={Icons} c={activeSettings.colors}/>;
                    default: return <Dashboard txns={txns} cur={cur} setActiveCurrency={setCur} settings={activeSettings} t={t} isVip={vip} user={user} onOpenSettings={()=>setShowSettings(true)} onOpenCountryMenu={()=>setShowCountryModal(true)} expire={exp} formatMoneda={formatMoneda} Icons={Icons} c={activeSettings.colors}/>;
                }
            };

            const zS = (activeSettings.zoom||100)/100; 
            const c = activeSettings.colors;
            
            return (
                <div className="min-h-screen flex flex-col relative" style={{ fontFamily: activeSettings.fontFamily }}>
                    <div className="flex-1 pb-28" style={{ transform:`scale(${zS})`, transformOrigin:'top center' }}>{renderV()}</div>
                    
                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md backdrop-blur-md rounded-[2rem] flex justify-around px-2 py-3 shadow-[0_10px_40px_rgba(0,0,0,0.5)] border z-40 transition-colors duration-300" style={{backgroundColor: `${c.navBg}F2`, borderColor: c.border}}>
                        {[{id:'home', I:Icons.Home, l:t('home')||'Inicio'},{id:'nueva', I:Icons.Plus, l:t('record')||'Registrar'},{id:'analisis', I:Icons.Brain, l:t('analysis')||'Análisis'},{id:'historial', I:Icons.List, l:t('history')||'Historial'}].map(x => {
                            const IconComponent = x.I;
                            return (
                                <button key={x.id} onClick={()=>setView(x.id)} className={`flex flex-col items-center justify-center min-w-[4rem] transition-all duration-300 ${view===x.id?'scale-110 -translate-y-1':'text-secondary hover:text-primary'}`} style={view===x.id ? {color: c.navActiveText} : {}}>
                                    <IconComponent c="w-6 h-6"/>
                                    <span className={`text-[10px] mt-1.5 font-bold tracking-wide ${view===x.id?'opacity-100':'opacity-0 h-0 overflow-hidden'}`}>{x.l}</span>
                                </button>
                            );
                        })}
                    </div>
                    
                    {showSettings && <AjustesModal settings={activeSettings} saveSettings={handleSaveSettings} onPreview={setPreviewSettings} user={user} isVip={vip} onLogout={logout} onUpgrade={()=>setShowPay(true)} onClose={handleCloseSettings} Icons={Icons} c={c}/>}
                    {showCountryModal && <CountryModal onClose={()=>setShowCountryModal(false)} settings={activeSettings} saveSettings={handleSaveSettings} c={c} />}
                    {showPay && <PaymentModal onClose={()=>setShowPay(false)} t={t} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
